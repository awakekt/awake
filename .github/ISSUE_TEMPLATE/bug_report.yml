name: Bug Report
description: Report a bug, crash, or unexpected behavior in Awake Engine.
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with Awake Engine! Please fill out the form below to help diagnose and resolve the problem.
  - type: checkboxes
    id: terms
    attributes:
      label: Pre-submission Checks
      options:
        - label: I searched existing GitHub issues and discussions to confirm this has not already been reported.
          required: true
        - label: I verified that the issue persists on the latest commit or release.
          required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem / Area
      description: Select the primary module where the issue occurs.
      options:
        - "awake:backend:vulkan (Vulkan Renderer / MoltenVK)"
        - "awake:backend:webgpu (WebGPU Renderer)"
        - "awake:core (Math, Transforms, Animation)"
        - "awake:ecs (Entity Component System)"
        - "awake:compose (Compose Multiplatform UI)"
        - "awake:scene:physics (Jolt Physics)"
        - "awake:asset (glTF, Naga Shader Compiler, Textures)"
        - "apps:studio (Awake Studio Editor)"
        - "build-logic / KMP Tooling (Gradle, Dependencies)"
        - "Other / Unknown"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Target Platform & OS
      description: Platform where the bug is observed.
      options:
        - "macOS (Apple Silicon)"
        - "macOS (Intel)"
        - "Linux (x86_64)"
        - "Windows (x86_64)"
        - "Android"
        - "iOS"
        - "Web / Wasm"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: GPU Hardware & Driver
      description: GPU model, driver version, and Vulkan SDK / Browser version (for WebGPU).
      placeholder: "e.g., Apple M2 Pro, macOS 14.5; or NVIDIA RTX 4080, Driver 550.54, Vulkan 1.3"
    validations:
      required: true
  - type: input
    id: kotlin_version
    attributes:
      label: Kotlin / Compose Version
      description: Kotlin and Compose Multiplatform versions used.
      placeholder: "e.g., Kotlin 2.4.10, Compose Multiplatform 1.11.1"
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps or a minimal code snippet / sample scene to reproduce the behavior.
      placeholder: |
        1. Initialize engine with Vulkan backend...
        2. Load scene 'rotating-cube.scene.json'...
        3. Observe crash or rendering artifact...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, Stack Traces, or Screenshots
      description: Paste relevant terminal logs, stack traces (including Vulkan validation layer output), or attach screenshots.
      render: shell
