name: Deploy Samples

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'awake/**'
      - 'samples/engine-showcase/**'
      - 'samples/ui-showcase/**'
      - 'scripts/prepare-samples-site.sh'
      - 'website/samples/**'
      - 'website/landing/awake-mark.svg'
      - '.github/workflows/deploy-samples-cloudflare.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

concurrency:
  group: samples-cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write   # wrangler-action records the Pages deploy as a GitHub deployment
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build production Wasm bundles
        run: >-
          ./gradlew
          :samples:engine-showcase:wasmJsBrowserProductionWebpack
          :samples:ui-showcase:wasmJsBrowserProductionWebpack
          --no-daemon --console=plain

      - name: Assemble Pages site
        run: ./scripts/prepare-samples-site.sh build/samples-site

      - name: Ensure Pages project exists
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create awake-samples --production-branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/samples-site --project-name=awake-samples
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Idempotent. The DNS record needs Zone:Read and DNS:Edit on awakekt.com; without them the
      # step only attaches the domain and prints the CNAME to add by hand.
      - name: Attach demo.awakekt.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: awake-samples
          DOMAIN: demo.awakekt.com
          ZONE: awakekt.com
        run: |
          api() { curl --fail-with-body --silent --show-error --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$@"; }
          pages="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"

          if api "${pages}/domains" | jq -e --arg d "$DOMAIN" '.result[] | select(.name == $d)' >/dev/null; then
            echo "$DOMAIN is already attached to $PAGES_PROJECT."
          else
            api --request POST --header "Content-Type: application/json" \
              --data "$(jq -nc --arg d "$DOMAIN" '{name: $d}')" "${pages}/domains" | jq -e '.success' >/dev/null
            echo "Attached $DOMAIN to $PAGES_PROJECT."
          fi

          target="$(api "$pages" | jq -r '.result.subdomain')"
          manual="Add a proxied CNAME $DOMAIN -> $target in the $ZONE zone."
          zone_id="$(api "https://api.cloudflare.com/client/v4/zones?name=${ZONE}" 2>/dev/null | jq -r '.result[0].id // empty')" || true
          if [[ -z "$zone_id" ]]; then
            echo "::notice::Token cannot read the $ZONE zone. $manual"
            exit 0
          fi
          records="https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records"
          existing="$(api "${records}?name=${DOMAIN}" | jq -c '.result')"
          if jq -e --arg t "$target" '.[] | select(.type == "CNAME" and .content == $t)' <<<"$existing" >/dev/null; then
            echo "CNAME $DOMAIN -> $target already exists."
          elif [[ "$(jq length <<<"$existing")" != 0 ]]; then
            echo "::warning::A different DNS record already exists for $DOMAIN; not overwriting it. $manual"
          elif api --request POST --header "Content-Type: application/json" \
              --data "$(jq -nc --arg n "$DOMAIN" --arg t "$target" '{type: "CNAME", name: $n, content: $t, ttl: 1, proxied: true}')" \
              "$records" >/dev/null; then
            echo "Created CNAME $DOMAIN -> $target."
          else
            echo "::notice::Token cannot edit DNS for $ZONE. $manual"
          fi
