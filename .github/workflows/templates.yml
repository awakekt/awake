# Builds the starter templates in templates/ against this pull request's Core, published to Maven
# Local, the way a game made from one resolves it. The Consumer job in build-and-publish.yml does the
# same after a merge, on macOS and with the iOS link; this catches a break before the merge, in the
# pull request that causes it.
#
# A pull request runs it when it can break a template: the templates themselves, Core's public API
# (its dumps change with it), the version catalog, and the build logic that publishes Core.
#
# A Core release builds the templates against the latest Vulkan release on Maven Central, not against
# its own commit's Vulkan, so a pull request that changes a template with a desktop app also compiles
# that app against the latest Vulkan release (#1282).
name: Templates

on:
  pull_request:
    paths:
      - templates/**
      - tools/check_template_consumer.sh
      - tools/check_scene_components_consumer.sh
      - tools/scene-components-consumer/**
      - awake/scene/binding/**
      - .github/workflows/templates.yml
      - 'awake/**/api/**'
      - gradle/libs.versions.toml
      - build-logic/**
  workflow_dispatch:

concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  templates:
    name: Templates
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, from which the build derives this commit's version (see "Name the local version").
          fetch-depth: 0

      # Core's full publish and three templates' builds don't fit the runner's free space otherwise.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Vulkan headers and loader, and GLFW, to build the desktop native libraries Core publishes.
      - name: Install desktop Vulkan and GLFW
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libglfw3-dev

      # A version no release uses, so the templates resolve exactly what this run publishes.
      - name: Name the local version
        run: |
          version=$(./gradlew -q :awake:core:math:properties --no-configuration-cache | awk '$1 == "version:" { print $2; exit }')
          echo "LOCAL_VERSION=${version%-SNAPSHOT}-templates" | tee -a "$GITHUB_ENV"

      # The window's and the Vulkan bindings' desktop libraries are built on demand, for this host.
      - name: Publish this pull request's Core locally
        id: publish
        run: |
          ./gradlew :awake:engine:window:buildDesktopNative :awake:backend:vulkan:bindings:buildDesktopNative --no-configuration-cache
          ./gradlew publishToMavenLocal -Pawake.version="$LOCAL_VERSION" --no-configuration-cache
          ./gradlew -p build-logic publishToMavenLocal -Pawake.version="$LOCAL_VERSION" --no-configuration-cache

      - name: Build the templates against it
        env:
          TEMPLATE_CORE_VERSION: ${{ env.LOCAL_VERSION }}
          TEMPLATE_VULKAN_VERSION: ${{ env.LOCAL_VERSION }}
        run: |
          tools/check_template_consumer.sh templates/game "$RUNNER_TEMP/game"
          tools/check_template_consumer.sh templates/project "$RUNNER_TEMP/project"
          tools/check_template_consumer.sh templates/plugin "$RUNNER_TEMP/plugin"
          tools/check_scene_components_consumer.sh "$RUNNER_TEMP/scene-components"

      # A Core release's Consumer job (build-and-publish.yml) builds the templates against the latest
      # Vulkan release on Maven Central, not this commit's Vulkan: the Vulkan family is released by its
      # own vulkan-v* tag, after Core is on Central (docs/release-process.md, "Independent Vulkan
      # family"). A template that calls a Vulkan API added since that release passes the step above and
      # fails the release, as v0.37.0's did (#1282). So compile the desktop apps, where the templates
      # call the Vulkan backend, against that release and this pull request's Core, as that job does.
      # Only a template change can fail this: the Vulkan release on Central is fixed.
      - name: Compile the desktop apps against the latest Vulkan release
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEMPLATE_CORE_VERSION: ${{ env.LOCAL_VERSION }}
          TEMPLATE_PREPARE_ONLY: '1'
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # The whole diff first: `grep -q` exits at its first match, and the SIGPIPE to a
            # still-writing git diff would turn a match into a skip under pipefail.
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
            if ! grep -Eq '^(templates/(game|project)/|tools/(check_template_consumer|stamp_template_versions)\.sh$|\.github/workflows/templates\.yml$)' <<< "$changed"; then
              echo "No change to templates/game or templates/project: their desktop apps build as on the base branch."
              exit 0
            fi
          fi
          # Central's own latest release, read as the Consumer job's "Resolve both publication-family
          # versions" step reads it.
          TEMPLATE_VULKAN_VERSION=$(curl -fsS --retry 5 --retry-all-errors \
            https://repo.maven.apache.org/maven2/com/awakekt/awake/backend/vulkan/maven-metadata.xml \
            | sed -n 's:.*<release>\(.*\)</release>.*:\1:p')
          if [[ -z "$TEMPLATE_VULKAN_VERSION" ]]; then
            echo "::error::Could not read the latest Vulkan release from Maven Central's maven-metadata.xml."
            exit 1
          fi
          export TEMPLATE_VULKAN_VERSION
          failed=()
          for template in game project; do
            work="$RUNNER_TEMP/$template-released-vulkan"
            # TEMPLATE_PREPARE_ONLY: copy the template and stamp Core and Vulkan into it, then stop.
            tools/check_template_consumer.sh "templates/$template" "$work"
            echo "==> templates/$template desktop app against Core $TEMPLATE_CORE_VERSION and Vulkan $TEMPLATE_VULKAN_VERSION"
            (cd "$work/awake-template" && ./gradlew :app:desktopApp:compileKotlin --no-configuration-cache --console=plain) \
              || failed+=("templates/$template")
          done
          for template in "${failed[@]}"; do
            echo "::error::$template: this template uses a Vulkan API newer than the latest Vulkan release $TEMPLATE_VULKAN_VERSION; it has to wait for that Vulkan release (see docs/release-process.md)"
          done
          (( ${#failed[@]} == 0 ))

  scene-components-native:
    name: Scene component consumer (native)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # This consumer only needs the binding runtime and its pure-Kotlin dependency closure.
      # It reaches no renderer, native interop, window or content transport backend.
      - name: Publish the scene binding toolchain locally
        run: |
          version=$(./gradlew -q :awake:core:math:properties --no-configuration-cache | awk '$1 == "version:" { print $2 }')
          local_version="${version%-SNAPSHOT}-scene-components"
          echo "TEMPLATE_CORE_VERSION=$local_version" >> "$GITHUB_ENV"
          modules=(core:math2d core:math core:color core:logging core:host core:io core:schema ecs scene:document scene:binding scene:binding:processor bom)
          tasks=()
          for module in "${modules[@]}"; do tasks+=(":awake:$module:publishToMavenLocal"); done
          ./gradlew "${tasks[@]}" -Pawake.version="$local_version" --no-configuration-cache --max-workers=2
          ./gradlew -p build-logic publishToMavenLocal -Pawake.version="$local_version" --no-configuration-cache --max-workers=2

      - name: Test the external consumer on every target
        run: tools/check_scene_components_consumer.sh "$RUNNER_TEMP/scene-components-native"
