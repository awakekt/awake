name: Publish

# Two paths, deliberately different.
#
# A push to `main` publishes a snapshot: the version derives to `-SNAPSHOT`, and a consumer opts
# into it by adding the snapshot repository. A `v*` tag publishes a release, which is immutable the
# moment it lands on Central and cannot be replaced. So the release path carries every gate the
# snapshot path does, plus the ones that only matter once something is permanent.
#
# The separation is structural rather than a convention someone remembers: the release job's `if`
# tests the tag ref, so no branch push can reach it however the workflow is triggered.
on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
      - 'vulkan-v*'

# One run per ref, and a run in progress always finishes. A run publishes its snapshot about an hour
# in, so cancelling it for a newer push threw the snapshot away, and a day of steady merges published
# none (#573). Runs do not pile up either: a concurrency group keeps at most one waiting run, and a
# newer push replaces it, so a snapshot lags `main` by at most one run and arrives in commit order.
# A tag has its own ref, so a release never waits behind snapshots.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  # Classify the change once. Core publication remains independent from the Vulkan family, so a
  # Core-only commit can skip the native matrix while still running the Core consumer gate.
  platform-impact:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.impact.outputs.core }}
      ios: ${{ steps.impact.outputs.ios }}
      vulkan: ${{ steps.impact.outputs.vulkan }}
      web: ${{ steps.impact.outputs.web }}
      docs_only: ${{ steps.impact.outputs.docs_only }}
      vulkan_publish: ${{ steps.vulkan-publish.outputs.vulkan_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: impact
        uses: ./.github/actions/detect-platform-impact
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}

      # Platform impact and publication impact are intentionally separate. A shared Gradle or
      # workflow change may need Vulkan validation in CI, but it must not republish the independent
      # Vulkan version train when no Vulkan-family source changed.
      - id: vulkan-publish
        uses: ./.github/actions/detect-vulkan-publication-impact
        with:
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}

  # A host compiles only its own native library, so a jar covering more than one platform has to be
  # assembled from several runners. Each uploads just its `natives/<platform>/` directory; the
  # publish jobs below merge them before packaging.
  natives:
    name: Natives (${{ matrix.platform }})
    timeout-minutes: 30
    needs: platform-impact
    if: needs.platform-impact.outputs.vulkan_publish == 'true'
    strategy:
      # One platform failing should not hide whether the others built -- verifyDesktopNatives is
      # what decides if the set is complete.
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos-arm64
          - runner: ubuntu-latest
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every Gradle invocation derives the version from `git describe --tags`, including this
          # one -- the native library is packaged under it. A shallow clone fetches no tags, so
          # describe returns a bare SHA and the artifact is stamped 0.1.0-dev.0-SNAPSHOT no matter
          # which tag triggered the run.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Vulkan (macOS)
        if: runner.os == 'macOS'
        run: brew install vulkan-loader molten-vk glfw

      # libvulkan-dev gives CMake's find_package(Vulkan) its headers and loader. The same packages
      # ci.yml's desktop-vulkan-smoke job installs, which is the job that proves this compiles here.
      - name: Install Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libglfw3-dev mesa-vulkan-drivers

      - name: Build the desktop native library
        run: ./gradlew :awake:backend:vulkan:bindings:buildDesktopNative

      - name: Upload ${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: awake/backend/vulkan/bindings/build/generated/natives-resources/natives/${{ matrix.platform }}
          if-no-files-found: error

  # The Vulkan renderer compiles every WGSL shader through naga at runtime, so the Android
  # shader-compiler AAR must carry libawake_naga.so. It is gitignored build output; build it here
  # and hand it to every job that publishes, or Android apps render nothing.
  # libawake-window ships in Core's awake:engine:window desktop jar, so every Core publication needs
  # it for each supported platform. A host builds only its own; the publish jobs collect them.
  window-natives:
    name: Window natives (${{ matrix.platform }})
    timeout-minutes: 30
    if: ${{ !startsWith(github.ref, 'refs/tags/vulkan-v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos-arm64
          - runner: ubuntu-latest
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Install GLFW (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw
      - name: Install GLFW (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev
      - name: Build libawake-window
        run: ./gradlew :awake:engine:window:buildDesktopNative
      - name: Upload ${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: window-native-${{ matrix.platform }}
          path: awake/engine/window/build/generated/natives-resources/natives/${{ matrix.platform }}
          if-no-files-found: error

  naga-android:
    name: Naga (Android)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Android targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build libawake_naga.so
        working-directory: awake/asset/shader-compiler/rust-native
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t arm64-v8a -t x86_64 -o ../src/androidMain/jniLibs build --release

      - name: Upload naga-android
        uses: actions/upload-artifact@v4
        with:
          name: naga-android
          path: awake/asset/shader-compiler/src/androidMain/jniLibs
          if-no-files-found: error

  # What must hold before anything is uploaded anywhere. Runs for snapshots and releases alike:
  # a snapshot nobody can resolve wastes the same afternoon a broken release does.
  verify:
    name: Verify
    timeout-minutes: 30
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # MoltenVK and JoltC are submodules, and apiCheck pulls iOS cinterop into its task
          # graph, so without them it fails on a missing header rather than on any API change.
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # apiCheck compiles every target, including the iOS ones.
      - name: Install Vulkan (macOS)
        run: brew install vulkan-loader molten-vk glfw

      - uses: ./.github/actions/ios-native

      - name: Verify Awake repository gates
        run: ./gradlew awakeVerify --no-configuration-cache

      - name: Verify API surface
        run: ./gradlew apiCheck

      - name: Verify the public Awake Gradle plugin set
        run: ./gradlew -p build-logic verifyAwakePluginPublications build --no-configuration-cache

  # Builds both starter templates against these artifacts, the way someone who clicked "Use this
  # template" would: awake-template (a game written in Kotlin) and awake-project-template (an app
  # that plays an Awake Studio project, which Studio's app export ships). Every bug this has caught --
  # a package namespace the template never followed, two libraries claiming one Android namespace --
  # is invisible from inside either repository.
  #
  # macOS because it is the only runner that can link the iOS framework, and iOS is otherwise
  # untested anywhere in this repository.
  consumer:
    name: Consumer
    # `!cancelled()`, not `always()`: both let a skipped `natives` through, but a job gated by
    # `always()` ignores a cancel, so a cancelled run kept building here and held the concurrency slot
    # the next run waits on (#573).
    if: >-
      ${{
        !cancelled() &&
        !startsWith(github.ref, 'refs/tags/vulkan-v') &&
        needs.platform-impact.result == 'success' &&
        needs.naga-android.result == 'success' &&
        (needs.natives.result == 'success' || needs.natives.result == 'skipped')
      }}
    needs: [platform-impact, natives, naga-android]
    timeout-minutes: 120
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # `publishToMavenLocal -PisMainHost=true` below builds the iOS klibs, which cinterop
          # against MoltenVK and JoltC. Both are submodules, and this job is the one that claims
          # to link the iOS framework, so it is the last place that can afford to skip them.
          submodules: recursive

      - name: Check out the template beside nothing
        uses: actions/checkout@v4
        with:
          repository: awakekt/awake-template
          # Deliberately not a sibling named `awaken`: the template's settings.gradle.kts
          # substitutes engine projects for the published artifacts when one is next to it, and
          # then this job would prove nothing.
          path: consumer/awake-template

      - name: Check out the project template beside nothing
        uses: actions/checkout@v4
        with:
          # The app that plays an Awake Studio project; Studio's app export starts from it.
          repository: awakekt/awake-project-template
          path: consumer/awake-project-template

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Vulkan (macOS)
        run: brew install vulkan-loader molten-vk glfw

      - uses: ./.github/actions/ios-native

      # Resolve versions before downloading natives. Core-only changes use the last published
      # Vulkan release and therefore do not need the native artifact matrix at all.
      - name: Resolve both publication-family versions
        id: versions
        shell: bash
        run: |
          core_version=$(./gradlew -q :awake:core:math:properties --no-configuration-cache \
            | awk '/^version:/ { print $2 }')
          vulkan_version=$(./gradlew -q :awake:backend:vulkan:properties --no-configuration-cache \
            | awk '/^version:/ { print $2 }')
          echo "CORE_VERSION=$core_version" >> "$GITHUB_ENV"
          echo "VULKAN_VERSION=$vulkan_version" >> "$GITHUB_ENV"
          echo "vulkan_publish=${{ needs.platform-impact.outputs.vulkan_publish }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ needs.platform-impact.outputs.vulkan_publish }}" != 'true' ]]; then
            template_vulkan_version=$(git describe --tags --match 'vulkan-v*' --abbrev=0)
            echo "TEMPLATE_VULKAN_VERSION=${template_vulkan_version#vulkan-v}" >> "$GITHUB_ENV"
          fi

      - name: Collect desktop natives for local publication
        if: steps.versions.outputs.vulkan_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/collected-natives/natives

      - name: Name collected native directories by platform
        if: steps.versions.outputs.vulkan_publish == 'true'
        run: |
          cd build/collected-natives/natives
          for d in native-*; do mv "$d" "${d#native-}"; done
          ls -R .

      - name: Collect naga-android
        uses: actions/download-artifact@v4
        with:
          name: naga-android
          path: awake/asset/shader-compiler/src/androidMain/jniLibs
      # Maven Local rather than the snapshot repository: this has to pass *before* anything is
      # uploaded, including the snapshot a consumer would otherwise be the first to try.
      - name: Publish this build locally
        run: |
          if [[ "${{ steps.versions.outputs.vulkan_publish }}" == 'true' ]]; then
            ./gradlew publishToMavenLocal -PisMainHost=true \
              -Pawake.prebuiltNatives=$PWD/build/collected-natives \
              --no-configuration-cache
          else
            # A Core-only change tests against the last published Vulkan release rather than
            # rebuilding that immutable coordinate with a newer Core snapshot in local Maven.
            ./gradlew publishToMavenLocal -PisMainHost=true -Pawake.publishFamily=core \
              --no-configuration-cache
          fi

      - name: Verify what was published
        run: |
          ./gradlew verifyPublishedArtifacts -Pawake.verifyPublishedVersion="$CORE_VERSION" -Pawake.verifyPublishedFamily=core --no-configuration-cache
          if [[ "${{ steps.versions.outputs.vulkan_publish }}" == 'true' ]]; then
            ./gradlew verifyPublishedArtifacts -Pawake.verifyPublishedVersion="$VULKAN_VERSION" -Pawake.verifyPublishedFamily=vulkan --no-configuration-cache
          fi

      - name: Wait for the tagged Vulkan release on Maven Central
        if: steps.versions.outputs.vulkan_publish != 'true'
        run: ./gradlew waitForVulkanCentral -Pawake.waitForVulkanVersion="$TEMPLATE_VULKAN_VERSION" --no-configuration-cache

      - name: Build both templates against it
        run: |
          # A Core-only build put no Vulkan in Maven Local, and the derived Vulkan version is a
          # snapshot once Vulkan has changed since its last tag. Test against the last Vulkan
          # release instead: it's what a consumer gets until the next vulkan-v* tag.
          # The version was resolved above and its metadata and binaries checked on Central.
          tools/check_template_consumer.sh consumer/awake-template "$RUNNER_TEMP/consumer"
          tools/check_template_consumer.sh consumer/awake-project-template "$RUNNER_TEMP/consumer-project"

  # `main` builds. Resolvable only by a consumer who adds the snapshot repository, and replaced by
  # the next push, so this path stays deliberately light.
  snapshot:
    name: Snapshot
    timeout-minutes: 60
    # `!cancelled()` for the reason given on Consumer.
    if: >-
      ${{
        !cancelled() &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) &&
        needs.verify.result == 'success' &&
        needs.consumer.result == 'success' &&
        needs.naga-android.result == 'success' &&
        needs.window-natives.result == 'success'
      }}
    needs: [verify, consumer, naga-android, window-natives]
    runs-on: macos-14
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # `isMainHost=true` publishes the iOS klibs, which cinterop against MoltenVK and JoltC.
          # Both are submodules; the default checkout leaves their directories empty.
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # iOS cinterop needs the MoltenVK headers, and the iOS publications are built here too.
      - name: Install Vulkan (macOS)
        run: brew install vulkan-loader molten-vk glfw

      - uses: ./.github/actions/ios-native

      - name: Refuse to publish a snapshot from a tag build
        run: |
          case "${{ github.ref }}" in
            refs/tags/*) echo "A tag must go through the release job." && exit 1 ;;
          esac

      - name: Collect naga-android
        uses: actions/download-artifact@v4
        with:
          name: naga-android
          path: awake/asset/shader-compiler/src/androidMain/jniLibs
      - name: Collect libawake-window
        uses: actions/download-artifact@v4
        with:
          pattern: window-native-*
          path: build/window-natives/awake-window/natives
      - name: Flatten window native directories
        run: |
          cd build/window-natives/awake-window/natives
          for d in window-native-*; do mv "$d" "${d#window-native-}"; done
      # A tag pushed right after its commit makes this main run derive the release version; the tag
      # run owns that publication.
      - name: Resolve snapshot version
        id: snapshot-version
        run: |
          version=$(./gradlew -q :awake:core:math:properties --no-configuration-cache | awk '/^version:/ { print $2 }')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-SNAPSHOT ]] || echo "::notice::$version is a release version; the tag run publishes it."

      - name: Publish snapshots
        if: endsWith(steps.snapshot-version.outputs.version, '-SNAPSHOT')
        run: |
          ./gradlew :awake:engine:window:verifyDesktopNatives -Pawake.prebuiltNatives="$PWD/build/window-natives" --no-configuration-cache
          ./gradlew publishAllPublicationsToMavenCentralRepository \
                    -PisMainHost=true \
                    -Pawake.publishFamily=core \
                    -Pawake.prebuiltNatives="$PWD/build/window-natives" \
                    --no-configuration-cache \
                    --max-workers=4
          ./gradlew -p build-logic publishAllPublicationsToMavenCentralRepository \
                    --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ env.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ env.MAVEN_CENTRAL_PASSWORD }}

  vulkan-snapshot:
    name: Vulkan Snapshot
    timeout-minutes: 60
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && needs.platform-impact.outputs.vulkan_publish == 'true'
    needs: [platform-impact, natives, verify, snapshot]
    runs-on: macos-14
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Vulkan (macOS)
        run: brew install vulkan-loader molten-vk glfw

      - uses: ./.github/actions/ios-native

      - name: Collect Vulkan desktop natives
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/collected-natives/natives

      - name: Flatten native artifact directories
        run: |
          cd build/collected-natives/natives
          for d in native-*; do mv "$d" "${d#native-}"; done

      - name: Verify and publish only the Vulkan family
        run: bash tools/publish_vulkan_family.sh snapshot "$PWD/build/collected-natives"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ env.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ env.MAVEN_CENTRAL_PASSWORD }}

  # Tags only. What lands here is permanent: Central does not allow a version to be replaced, so
  # every check that would be embarrassing to discover afterwards runs before the upload.
  release:
    name: Release
    # Room for Central to validate the deployment: the upload waits for its verdict.
    timeout-minutes: 90
    # Explicit results: without them GitHub skips this job whenever any transitive dependency was
    # skipped, and `natives` is always skipped for a Core-only release (via consumer).
    if: >-
      ${{
        !cancelled() &&
        startsWith(github.ref, 'refs/tags/v') &&
        !startsWith(github.ref, 'refs/tags/vulkan-v') &&
        needs.verify.result == 'success' &&
        needs.consumer.result == 'success' &&
        needs.naga-android.result == 'success' &&
        needs.window-natives.result == 'success'
      }}
    needs: [verify, consumer, naga-android, window-natives]
    runs-on: macos-14
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      # No key id: vanniktech only needs one to disambiguate a key ring holding several
      # subkeys, and passing it blank reads as set-but-empty rather than absent.
      SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
      SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from `git describe --tags`. checkout's default shallow clone
          # fetches no tags, so describe would return a bare SHA and the build would publish
          # 0.1.0-dev.0-SNAPSHOT no matter which tag triggered it.
          fetch-depth: 0
          # Same reason as the snapshot job: the iOS publications cinterop against MoltenVK and
          # JoltC, and both are submodules.
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Vulkan (macOS)
        run: brew install vulkan-loader molten-vk glfw

      - uses: ./.github/actions/ios-native

      # A tag whose version derives to a snapshot means `git describe` did not see the tag -- a
      # shallow clone, or a tag that never reached the runner. Publishing anyway would put a
      # -SNAPSHOT on the release path and quietly produce no release at all.
      - name: Refuse to release a snapshot version
        run: |
          VERSION=$(./gradlew -q :awake:core:math:properties --no-configuration-cache \
                    | awk '/^version:/ { print $2 }')
          echo "Releasing $VERSION from ${{ github.ref }}"
          case "$VERSION" in
            *-SNAPSHOT) echo "A tag build derived a snapshot version; the tag is not visible to git describe." && exit 1 ;;
          esac
          case "${{ github.ref_name }}" in
            "v$VERSION") ;;
            *) echo "Tag ${{ github.ref_name }} does not match derived version $VERSION." && exit 1 ;;
          esac

      # Local publication first: the same inspection a consumer's resolution would perform, run
      # while it is still free to fail. Central accepts uploads it cannot later be told to forget.
      - name: Collect naga-android
        uses: actions/download-artifact@v4
        with:
          name: naga-android
          path: awake/asset/shader-compiler/src/androidMain/jniLibs
      - name: Collect libawake-window
        uses: actions/download-artifact@v4
        with:
          pattern: window-native-*
          path: build/window-natives/awake-window/natives
      - name: Flatten window native directories
        run: |
          cd build/window-natives/awake-window/natives
          for d in window-native-*; do mv "$d" "${d#window-native-}"; done
      - name: Verify what will be published
        run: |
          VERSION=$(./gradlew -q :awake:core:math:properties --no-configuration-cache \
                    | awk '/^version:/ { print $2 }')
          ./gradlew publishToMavenLocal -PisMainHost=true \
                    -Pawake.publishFamily=core \
                    -Pawake.prebuiltNatives="$PWD/build/window-natives" \
                    --no-configuration-cache
          ./gradlew verifyPublishedArtifacts -Pawake.verifyPublishedVersion="$VERSION" -Pawake.verifyPublishedFamily=core --no-configuration-cache
          ./gradlew :awake:engine:window:verifyDesktopNatives -Pawake.prebuiltNatives="$PWD/build/window-natives" --no-configuration-cache

      # The modules and build-logic's plugins go to Central as one deployment, so a release lands
      # whole or not at all. Uploaded separately, a refused second upload would leave modules on
      # Central without the plugins that build against them, and a published release cannot be
      # replaced. Where Central counts releases by deployment, it also spends one of the monthly
      # releases its publishing limits allow rather than two.
      - name: Stage the release
        id: stage
        run: |
          STAGING="$PWD/build/central-staging"
          rm -rf "$STAGING"
          ./gradlew publishAllPublicationsToCentralStagingRepository \
                    -PisMainHost=true \
                    -Pawake.publishFamily=core \
                    -Pawake.prebuiltNatives="$PWD/build/window-natives" \
                    -Pawake.stagingRepository="$STAGING" \
                    --no-configuration-cache
          ./gradlew -p build-logic publishAllPublicationsToCentralStagingRepository \
                    -Pawake.stagingRepository="$STAGING" \
                    --no-configuration-cache
          scripts/central-bundle.sh "$STAGING" build/central-bundle.zip

      - name: Publish to Maven Central
        run: scripts/central-upload.sh build/central-bundle.zip "awake ${{ github.ref_name }}"

      # The release and its bundle go on GitHub whenever the bundle was built, whatever Central
      # said: the Maven fallback workflow serves the newest two from GitHub Pages, and a release
      # Central refused is the one it exists for.
      - name: Ensure GitHub Release exists
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "GitHub release for ${{ github.ref_name }} already exists."
          else
            echo "Creating GitHub release for ${{ github.ref_name }}..."
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi

      - name: Attach the Maven repository to the GitHub Release
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="build/awake-${GITHUB_REF_NAME#v}-maven.zip"
          cp build/central-bundle.zip "$ASSET"
          gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber

  vulkan-release:
    name: Vulkan Release
    timeout-minutes: 60
    if: startsWith(github.ref, 'refs/tags/vulkan-v')
    needs: [natives, verify]
    runs-on: macos-14
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
      SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Vulkan (macOS)
        run: brew install vulkan-loader molten-vk glfw

      - uses: ./.github/actions/ios-native

      - name: Collect Vulkan desktop natives
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/collected-natives/natives

      - name: Flatten native artifact directories
        run: |
          cd build/collected-natives/natives
          for d in native-*; do mv "$d" "${d#native-}"; done

      - name: Verify and publish only the Vulkan family
        run: bash tools/publish_vulkan_family.sh release "$PWD/build/collected-natives"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ env.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ env.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ env.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ env.SIGNING_PASSWORD }}

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "GitHub Release for ${{ github.ref_name }} already exists."
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
