name: WebGPU release pin

# Keeps each recent Core release's WebGPU release pin, `<release>-SNAPSHOT` on Central's snapshot
# repository, from expiring, and publishes missing pins once Maven fallback serves a Core release
# that Maven Central refused under its publishing limits. Central documents removing snapshot builds
# after 90 days, and a pin it removed would break every downstream catalog that pairs a Core release
# with it. So once a week this republishes, from the release's own tag, any pin of the newest three
# releases whose latest build is over 60 days old or missing. Run it by hand with a tag to repair
# one pin whatever its age, such as one whose Publish run's webgpu-pin job failed.
#
# Only tags that carry tools/publish_webgpu_pin.sh have a pin: the pin is built by the tag's own
# script, from the tag's own build, never by main's code over an older release.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_run:
    workflows: [Maven fallback]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'A Core release tag (v0.8.6) to republish the pin for. Blank: the newest three that need it.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: webgpu-pin
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'

jobs:
  select:
    name: Select
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tags: ${{ steps.select.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select the pins to republish
        id: select
        env:
          IN_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          snapshots=https://central.sonatype.com/repository/maven-snapshots/com/awakekt/awake/backend/webgpu
          fallback=https://awakekt.github.io/awake/com/awakekt/awake/core/math
          has_script() { git cat-file -e "$1:tools/publish_webgpu_pin.sh" 2> /dev/null; }
          selected=()
          if [[ -n "$IN_TAG" ]]; then
            if [[ ! "$IN_TAG" =~ ^v[0-9] ]] || ! git rev-parse -q --verify "refs/tags/$IN_TAG" > /dev/null; then
              echo "::error::$IN_TAG is not a Core release tag." && exit 1
            fi
            has_script "$IN_TAG" || { echo "::error::$IN_TAG predates the WebGPU release pin." && exit 1; }
            selected+=("$IN_TAG")
          else
            cutoff=$(date -u -d '60 days ago' +%Y%m%d%H%M%S)
            day_ago=$(date -u -d '1 day ago' +%s)
            for tag in $(git tag --list 'v[0-9]*' --sort=-creatordate); do
              has_script "$tag" || continue
              candidates=$((${candidates:-0} + 1))
              core="${tag#v}"
              updated=$(curl -fsS --retry 3 --retry-all-errors "$snapshots/$core-SNAPSHOT/maven-metadata.xml" 2> /dev/null \
                | sed -n 's:.*<lastUpdated>\(.*\)</lastUpdated>.*:\1:p' | head -1 || true)
              if [[ "$EVENT_NAME" == "workflow_run" ]]; then
                if [[ -z "$updated" ]] && curl -fsSI "$fallback/$core/math-$core.pom" > /dev/null 2>&1; then
                  echo "$tag: served by Maven fallback with no WebGPU pin yet; publishing"
                  selected+=("$tag")
                else
                  echo "$tag: pin built ${updated:-not on fallback}"
                fi
              # A tag's own Publish run publishes its pin once Core is on Central, which can take hours.
              elif (( $(git for-each-ref --format='%(creatordate:unix)' "refs/tags/$tag") > day_ago )) \
                && ! curl -fsSI "$fallback/$core/math-$core.pom" > /dev/null 2>&1; then
                echo "$tag: its Publish run owns the pin"
              elif [[ -z "$updated" || "$updated" < "$cutoff" ]]; then
                echo "$tag: pin last built ${updated:-never}; republishing"
                selected+=("$tag")
              else
                echo "$tag: pin built $updated"
              fi
              (( candidates < 3 )) || break
            done
          fi
          echo "tags=$(jq -cn '$ARGS.positional' --args "${selected[@]}")" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish (${{ matrix.tag }})
    needs: select
    if: needs.select.outputs.tags != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.select.outputs.tags) }}
    # Room for the wait on Core, which is immediate for a release already on Central or fallback.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ matrix.tag }}
          # The pin's version and its Core pin both come from `git describe --tags`.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Verify and publish the WebGPU release pin
        env:
          TAG: ${{ matrix.tag }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          core="${TAG#v}"
          central_pom="https://repo.maven.apache.org/maven2/com/awakekt/awake/core/math/$core/math-$core.pom"
          fallback_pom="https://awakekt.github.io/awake/com/awakekt/awake/core/math/$core/math-$core.pom"
          has_fallback_wait=false
          if grep -q 'awakekt.github.io/awake' build-logic/src/main/kotlin/com/awakekt/awake/build/tasks/WaitForVulkanCentralTask.kt 2> /dev/null; then
            has_fallback_wait=true
          fi
          stale_wasm_check=false
          if grep -q 'kotlin\.publicationFormat=KOTLIN_ARCHIVE' gradle.properties 2> /dev/null \
            && grep -q 'backend/webgpu-wasm-js/' tools/publish_webgpu_pin.sh 2> /dev/null; then
            stale_wasm_check=true
          fi
          if [[ "$stale_wasm_check" == false ]] \
            && { curl -fsSI "$central_pom" > /dev/null 2>&1 || [[ "$has_fallback_wait" == true ]]; }; then
            bash tools/publish_webgpu_pin.sh
          elif curl -fsSI "$central_pom" > /dev/null 2>&1 || curl -fsSI "$fallback_pom" > /dev/null 2>&1; then
            echo "Building and verifying WebGPU $core-SNAPSHOT locally before uploading to Central snapshots (stale_wasm_check=$stale_wasm_check)."
            bash tools/publish_webgpu_pin.sh --local
            ./gradlew :awake:backend:webgpu:publishAllPublicationsToMavenCentralRepository \
              -Pawake.publishFamily=webgpu -PisMainHost=true --no-configuration-cache --max-workers=4
            base="https://central.sonatype.com/repository/maven-snapshots/com/awakekt/awake/backend"
            work="$(mktemp -d)"
            trap 'rm -rf "$work"' EXIT
            fetch_latest_module() {
              local artifact="$1" out_file="$2" url="$base/$1/$core-SNAPSHOT" meta ts bn b
              meta="$(curl -fsS --retry 5 --retry-all-errors "$url/maven-metadata.xml")"
              ts="$(sed -n 's:.*<timestamp>\(.*\)</timestamp>.*:\1:p' <<< "$meta" | tr -d '\r' | head -n 1)"
              bn="$(sed -n 's:.*<buildNumber>\(.*\)</buildNumber>.*:\1:p' <<< "$meta" | tr -d '\r' | head -n 1)"
              if [[ -z "$ts" || -z "$bn" ]]; then
                echo "The snapshot repository lists no build of $artifact $core-SNAPSHOT." >&2
                return 1
              fi
              b="$core-$ts-$bn"
              curl -fsS --retry 5 --retry-all-errors "$url/$artifact-$b.module" > "$out_file"
              printf '%s\n' "$b"
            }
            root_module="$work/webgpu.module"
            root_build="$(fetch_latest_module webgpu "$root_module")"
            if ! jq -e '.variants | any(.name == "wasmJsRuntimeElements-published")' "$root_module" > /dev/null; then
              echo "webgpu $root_build on the snapshot repository has no wasmJsRuntimeElements-published variant." >&2
              exit 1
            fi
            wasm_redirect="$(jq -r '[.variants[] | select(.name == "wasmJsRuntimeElements-published") | ."available-at".module // ""] | first // ""' "$root_module" | tr -d '\r')"
            target_module="$root_module"
            target_artifact="webgpu"
            target_build="$root_build"
            if [[ -n "$wasm_redirect" ]]; then
              target_artifact="$wasm_redirect"
              target_module="$work/$target_artifact.module"
              target_build="$(fetch_latest_module "$target_artifact" "$target_module")"
            fi
            if ! jq -e --arg core "$core" '
              def awake: .group | test("^com\\.awakekt\\.awake(\\.|$)");
              ([.variants[] | select(.name == "wasmJsRuntimeElements-published") | .dependencies[]? | select(awake and (.module | startswith("webgpu") | not))] | length) > 0
              and ([.variants[] |
                ([.dependencies[]? | select(awake and (.module | startswith("webgpu") | not))] as $deps |
                 [.dependencyConstraints[]? | select(awake)] as $constraints |
                 ($deps | all(.version.requires == $core))
                 and ($constraints | all(.version.strictly == $core))
                 and (([$deps[] | "\(.group):\(.module)"] - [$constraints[] | "\(.group):\(.module)"]) | length) == 0)
              ] | all)
            ' "$target_module" > /dev/null; then
              echo "$target_artifact $target_build on the snapshot repository does not hold every Core module strictly at $core." >&2
              exit 1
            fi
            echo "::notice::WebGPU $core-SNAPSHOT (build $target_build via $target_artifact) pins Core $core"
          else
            bash tools/publish_webgpu_pin.sh
          fi
