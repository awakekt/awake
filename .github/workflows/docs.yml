name: Docs

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Awake version to publish, without the leading v (for example 0.1.0-alpha.4)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: pip install "mkdocs-material==9.7.6" "mike==2.2.0"

      - name: Resolve documentation version
        id: docs-version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="$REF_NAME"
          fi
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported Awake version: $version" >&2
            exit 1
          fi
          alias=latest
          if [[ "$version" == *-dev.* ]]; then
            alias=dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          # The Vulkan backend has its own release train; install snippets pair Core with the
          # newest Vulkan release.
          git fetch --quiet --tags origin
          vulkan="$(git tag --list 'vulkan-v*' --sort=-v:refname | head -n 1)"
          echo "vulkan=${vulkan#vulkan-v}" >> "$GITHUB_OUTPUT"

      - name: Build documentation
        working-directory: website
        env:
          AWAKE_DOCS_VERSION: ${{ steps.docs-version.outputs.version }}
          AWAKE_DOCS_VULKAN_VERSION: ${{ steps.docs-version.outputs.vulkan }}
        run: mkdocs build --strict

      - name: Publish versioned documentation
        working-directory: website
        env:
          AWAKE_DOCS_VERSION: ${{ steps.docs-version.outputs.version }}
          AWAKE_DOCS_VULKAN_VERSION: ${{ steps.docs-version.outputs.vulkan }}
          DOCS_VERSION: ${{ steps.docs-version.outputs.version }}
          DOCS_ALIAS: ${{ steps.docs-version.outputs.alias }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mike deploy "$DOCS_VERSION" "$DOCS_ALIAS" --update-aliases --alias-type copy --push
          if [ "$DOCS_ALIAS" = "latest" ]; then
            mike set-default latest --push
          fi

      - name: Prepare Cloudflare Pages site
        run: |
          git fetch origin gh-pages --depth=1
          rm -rf "$RUNNER_TEMP/awake-docs-site"
          mkdir -p "$RUNNER_TEMP/awake-docs-site"
          git archive origin/gh-pages | tar -x -C "$RUNNER_TEMP/awake-docs-site"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action runs this without a shell, so $RUNNER_TEMP would stay literal.
          command: pages deploy "${{ runner.temp }}/awake-docs-site" --project-name=awake-docs
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Idempotent. Creating the DNS record needs Zone:Read and DNS:Edit on awakekt.com; without
      # them, or when another record already holds the name, the step attaches the domain and
      # prints the CNAME to set by hand.
      - name: Attach docs.awakekt.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: awake-docs
          DOMAINS: docs.awakekt.com
          ZONE: awakekt.com
        run: |
          api() { curl --fail-with-body --silent --show-error --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$@"; }
          pages="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}"
          target="$(api "$pages" | jq -r '.result.subdomain')"
          zone_id="$(api "https://api.cloudflare.com/client/v4/zones?name=${ZONE}" 2>/dev/null | jq -r '.result[0].id // empty')" || true

          for domain in $DOMAINS; do
            if api "${pages}/domains" | jq -e --arg d "$domain" '.result[] | select(.name == $d)' >/dev/null; then
              echo "$domain is already attached to $PAGES_PROJECT."
            else
              api --request POST --header "Content-Type: application/json" \
                --data "$(jq -nc --arg d "$domain" '{name: $d}')" "${pages}/domains" | jq -e '.success' >/dev/null
              echo "Attached $domain to $PAGES_PROJECT."
            fi

            manual="Add a proxied CNAME $domain -> $target in the $ZONE zone."
            if [[ -z "$zone_id" ]]; then
              echo "::notice::Token cannot read the $ZONE zone. $manual"
              continue
            fi
            records="https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records"
            existing="$(api "${records}?name=${domain}" | jq -c '.result')"
            if jq -e --arg t "$target" '.[] | select(.type == "CNAME" and .content == $t)' <<<"$existing" >/dev/null; then
              echo "CNAME $domain -> $target already exists."
            elif [[ "$(jq length <<<"$existing")" != 0 ]]; then
              echo "::warning::A different DNS record already exists for $domain; not overwriting it. $manual"
            elif api --request POST --header "Content-Type: application/json" \
                --data "$(jq -nc --arg n "$domain" --arg t "$target" '{type: "CNAME", name: $n, content: $t, ttl: 1, proxied: true}')" \
                "$records" >/dev/null; then
              echo "Created CNAME $domain -> $target."
            else
              echo "::notice::Token cannot edit DNS for $ZONE. $manual"
            fi
          done
