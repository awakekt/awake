name: Awake Engine CI

on:
  push:
    # `dev/**` is where work actually lands: this repo integrates by merging branch into branch,
    # not by PR, and `main` has not moved since 2026-08-11 while `dev/improvement` ran ~900
    # commits past it. Pinned to main alone, CI did not run for two weeks -- which is how
    # `:awake:engine:app`, `awake:ui:testing`'s commonTest and `samples/ui-showcase`'s wasmJs all
    # stopped compiling with nothing reporting it. A source set nobody builds is indistinguishable
    # from one that passes.
    branches: [ main, 'dev/**' ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '26.1.10909125'

jobs:
  build:
    name: Multiplatform Core & ECS Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1" > /dev/null

      - name: Detekt (all modules, baselined)
        run: ./gradlew detekt

      # Every step below this one names a specific module, so a module nobody names is never
      # built. These two name none: Gradle runs the task in every project that has it, so a new
      # module is covered the day it exists. Compile-only on purpose -- running the suites would
      # pull in `:awake:backend:vulkan:desktopTest`, which needs the native library and lavapipe
      # that only the `desktop-vulkan-smoke` job installs.
      #
      # This is the gate that was missing. `awake:ui:testing`'s commonTest stopped compiling and
      # took all 75 of its tests out of every run; `samples/ui-showcase`'s wasmJs called a
      # constructor that no longer existed; `:awake:engine:app` had been broken for weeks. All
      # three looked exactly like passing, because nothing built them.
      - name: Every desktop test source set compiles
        run: ./gradlew compileTestKotlinDesktop

      - name: Jolt desktop physics tests
        run: ./gradlew :awake:backend:jolt:desktopTest :awake:scene:physics:desktopTest

      - name: Every wasmJs source set compiles
        run: ./gradlew compileKotlinWasmJs

      # hello-cube (retired) had a dedicated :androidApp wrapper module producing a real
      # installable APK, uploaded below as a regression artifact. ui-showcase only has a KMP
      # `android {}` library target (no application-plugin wrapper module), so this currently
      # builds the Android library AAR, not an installable APK -- a real gap versus hello-cube's
      # old coverage, left open until ui-showcase gets its own :androidApp wrapper.
      - name: Build Android demo APK (Vulkan JNI regression gate)
        run: ./gradlew :samples:engine-showcase:androidApp:assembleDebug

      - name: Build desktop demo
        run: ./gradlew :samples:ui-showcase:desktopJar

      # engine-showcase has complete multiplatform coverage across core ECS, physics, audio,
      # particles and navigation showcases.
      - name: Engine showcase sample (tests and desktop jar)
        run: ./gradlew :samples:engine-showcase:desktopTest :samples:engine-showcase:desktopJar

      - name: Build vulkan generator
        run: ./gradlew :awake:backend:vulkan:generator:assemble

  # Runner GPUs aren't available on GitHub-hosted runners, so this uses Mesa's lavapipe
  # (a real, fully-conformant software Vulkan implementation -- not a stub) to run the
  # actual vkCreateInstance/vkDestroyInstance smoke test (VulkanDesktopNativeSmokeTest)
  # headlessly. Separate job (not steps in `build` above) since it needs its own apt
  # packages and is the only job that builds awake:backend:vulkan's desktop-native C++ library.
  desktop-vulkan-smoke:
    name: Desktop Vulkan Smoke Test (Linux lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # libvulkan-dev: Vulkan headers + loader, for CMake's find_package(Vulkan) and
      # desktopMain's System.loadLibrary("awake-vulkan") to link/load against at run time.
      # libglfw3-dev: desktop-native/CMakeLists.txt's GLFW dependency (VulkanWindow).
      # mesa-vulkan-drivers: provides lavapipe's ICD (/usr/share/vulkan/icd.d/lvp_icd.*.json)
      # -- with no real GPU on the runner, this becomes the only Vulkan implementation the
      # loader can find, exactly what a headless CI smoke test needs.
      - name: Install desktop Vulkan/GLFW build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libglfw3-dev mesa-vulkan-drivers

      - name: Build desktop native Vulkan library
        run: ./gradlew :awake:backend:vulkan:bindings:buildDesktopNative

      # Conformance for the published vulkan-kmp bindings: their own desktop suite
      # (VulkanDesktopNativeSmokeTest and friends) ran nowhere in CI before this step --
      # the renderer's suite exercised them only indirectly.
      - name: vulkan-kmp bindings conformance (lavapipe)
        run: ./gradlew :awake:backend:vulkan:bindings:desktopTest

      - name: Desktop Vulkan smoke test (real vkCreateInstance via lavapipe)
        run: ./gradlew :awake:backend:vulkan:desktopTest

  # The only job on a macOS runner, and the only one that can build or run anything for iOS.
  # It exists because of measured history, not symmetry: the JoltC backend reached four features
  # deep while aborting on its very first `step` -- a fixed-size temp allocator sized under what
  # Jolt asks for -- and it compiled cleanly throughout. Three of the four physics bugs found on
  # 2026-08-31 were on this binding, which shares no code with any target covered above.
  ios-physics:
    name: iOS Jolt Physics & Metal Interop
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Not `submodules: recursive` on the checkout: that would also clone MoltenVK, which this
      # job never builds. JoltC needs its own nested JoltPhysics, hence --recursive here.
      - name: Check out JoltC (and its nested JoltPhysics)
        run: git submodule update --init --recursive awake/backend/jolt/ios-native/JoltC

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # On demand, like the desktop Vulkan library above: a CMake configure plus build of Jolt
      # itself is far too slow to hang off every Kotlin compile, so nothing depends on it and the
      # test below would fail to link without it.
      - name: Build JoltC for the simulator
        run: ./gradlew :awake:backend:jolt:buildJoltCIosSimulatorArm64

      - name: Jolt iOS simulator physics tests
        run: ./gradlew :awake:backend:jolt:iosSimulatorArm64Test :awake:scene:physics:iosSimulatorArm64Test

  web-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Wasm/WebGPU browser verification (headless Chrome)
        run: ./gradlew :samples:ui-showcase:wasmJsBrowserTest

      # The physics backend has four bindings and CI only ran one of them. This is the wasmJs
      # binding executing the same commonTest suite as desktop, on the runner already here --
      # it caught a body filter comparing an Emscripten pointer to a body id, which passed on
      # every other target.
      - name: Physics backend verification (wasmJs)
        run: ./gradlew :awake:backend:jolt:wasmJsTest :awake:scene:physics:wasmJsTest
