name: CI

on:
  push:
    # `dev/**` is where work actually lands: this repo integrates by merging branch into branch,
    # not by PR, and `main` has not moved since 2026-08-11 while `dev/improvement` ran ~900
    # commits past it. Pinned to main alone, CI did not run for two weeks -- which is how
    # `:awake:engine:app`, `awake:ui:testing`'s commonTest and `samples/ui-showcase`'s wasmJs all
    # stopped compiling with nothing reporting it. A source set nobody builds is indistinguishable
    # from one that passes.
    branches: [ main, 'dev/**' ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '26.1.10909125'

jobs:
  platform-impact:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.impact.outputs.core }}
      ios: ${{ steps.impact.outputs.ios }}
      vulkan: ${{ steps.impact.outputs.vulkan }}
      web: ${{ steps.impact.outputs.web }}
      docs_only: ${{ steps.impact.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed targets
        id: impact
        uses: ./.github/actions/detect-platform-impact
        with:
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.sha }}

  changelog:
    name: Changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Entries are fragments under changelog/unreleased/ (see its README): every PR editing the
      # same lines of CHANGELOG.md conflicted with every other open PR, and one merged after a
      # release cut filed its entry under a release that did not ship it.
      - name: Check changelog fragments
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
        # HEAD is the PR merged into the current base; its first parent is that base. The event's
        # base.sha can be older, and diffing from it counts base commits since then (a release
        # cut's CHANGELOG.md) as the PR's own.
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if [[ "$HEAD_REF" != release-cut/* ]] && grep -qx 'CHANGELOG.md' <<< "$changed"; then
            echo "::error file=CHANGELOG.md::Only a release cut edits CHANGELOG.md. Add a fragment instead: changelog/unreleased/<section>/<branch-name>.md (see changelog/unreleased/README.md)."
            exit 1
          fi
          if [[ "$TITLE" =~ ^(feat|fix)(\(.*\))?!?: ]] &&
             ! grep -qE '^changelog/unreleased/(added|changed|deprecated|removed|fixed|security)/[^/]+\.md$' <<< "$changed"; then
            echo "::error::A feat/fix PR needs a changelog fragment: changelog/unreleased/<added|changed|deprecated|removed|fixed|security>/<branch-name>.md"
            exit 1
          fi

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A mutable tag lets whoever controls it change what runs here with no change in this
      # repository. Dependabot (.github/dependabot.yml) moves the SHA and its comment together.
      - name: Actions are pinned to a commit
        run: |
          unpinned="$(grep -rnE '^[[:space:]]*(- )?uses:' .github/workflows .github/actions \
            | grep -vE 'uses:[[:space:]]*\./' \
            | grep -vE '@[0-9a-f]{40} # v[0-9]' || true)"
          if [[ -n "$unpinned" ]]; then
            echo "::error::Pin each action to a full commit SHA with its version in a '# vX.Y.Z' comment."
            echo "$unpinned"
            exit 1
          fi

      - name: Vulkan publication detector
        run: |
          scripts/vulkan-publication-impact.test.sh
          scripts/vulkan-core-api-impact.test.sh

      - name: Next release milestone
        run: scripts/next-milestone.test.sh

      # Before 1.0 a released public signature stays as a hidden overload, so a consumer built against
      # the last stable release still links. Compares the api dumps with that tag's, modifiers aside.
      - name: Released JVM signatures kept
        run: |
          scripts/api-binary-compat.test.sh
          tag="$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          git fetch --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          echo "Comparing the api dumps with $tag"
          scripts/api-binary-compat.sh "$tag" HEAD

      - name: Central bundle, upload and fallback repository
        run: |
          scripts/central-bundle.test.sh
          scripts/central-upload.test.sh
          scripts/maven-fallback-site.test.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Render evidence comment
        run: |
          python -m pip install --quiet 'pillow==12.3.0'
          python tools/shadcn/test_render_evidence.py
          python tools/fonts-tooling/text-evidence/test_text_evidence.py

  build:
    name: Build (JVM/Native)
    needs: platform-impact
    if: needs.platform-impact.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - uses: ./.github/actions/cache-naga
        with:
          variant: desktop
          target-path: awake/asset/shader-compiler/rust-native/target

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1" > /dev/null

      - name: Install desktop Vulkan/GLFW build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libglfw3-dev mesa-vulkan-drivers vulkan-validationlayers xvfb

      - name: No ponytail comment tags
        run: "! git grep -nIE 'ponytai[l]:' -- ':!CLAUDE.md' ':!AGENTS.md' ':!GEMINI.md'"
      - name: Detekt (all modules, baselined)
        run: ./gradlew detekt

      # Every step below this one names a specific module, so a module nobody names is never
      # built. These two name none: Gradle runs the task in every project that has it, so a new
      # module is covered the day it exists. Compile-only on purpose -- running the suites would
      # pull in `:awake:backend:vulkan:desktopTest`, which needs the native library and lavapipe
      # that only the `desktop-vulkan-smoke` job installs.
      #
      # This is the gate that was missing. `awake:ui:testing`'s commonTest stopped compiling and
      # took all 75 of its tests out of every run; `samples/ui-showcase`'s wasmJs called a
      # constructor that no longer existed; `:awake:engine:app` had been broken for weeks. All
      # three looked exactly like passing, because nothing built them.
      - name: Every desktop test source set compiles
        run: ./gradlew compileTestKotlinDesktop

      # This deterministic geometry-cost ratchet protects the CPU-side UI upload workload; it is
      # not a real-device FPS measurement.
      # Keep it as an explicit PR check so the test cannot silently regress to compile-only.
      - name: Core UI frame-cost ratchet (FPS proxy)
        run: >-
          ./gradlew :awake:ui:shadcn:desktopTest
          --tests com.awakekt.awake.ui.shadcn.UiFrameCostRatchetTest
          --no-daemon --stacktrace

      # Includes the pixel-exact CPU baselines and the JVM allocation ratchets.
      - name: Node graph canvas visual and allocation checks
        run: ./gradlew :awake:ui:node-graph-canvas:desktopTest --no-daemon --stacktrace

      - name: Upload node graph test measurements and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-graph-test-results
          path: |
            awake/ui/node-graph-canvas/build/test-results/desktopTest/
            awake/ui/node-graph-canvas/build/reports/tests/desktopTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Core UI frame-cost report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-ui-frame-cost-proxy
          path: awake/ui/shadcn/build/test-results/desktopTest/TEST-com.awakekt.awake.ui.shadcn.UiFrameCostRatchetTest.xml
          if-no-files-found: warn
          retention-days: 14

      # `project:runtime` plays whole projects (loading, physics bodies, colliders, AI, particles,
      # shader effects), and its physics tests need the same Jolt natives as the two suites above.
      # The compile step only built it, so a broken play path stayed green.
      - name: Jolt desktop physics and project runtime tests
        run: ./gradlew :awake:backend:jolt:desktopTest :awake:scene:physics:desktopTest :awake:project:runtime:desktopTest

      # Plugin manifests, archives and their signature checks on the JDK provider, desktop and
      # Android host, plus the editor contract's deprecated forwards to them.
      - name: Plugin archive and editor contract tests
        run: ./gradlew :awake:plugin-archive:desktopTest :awake:plugin-archive:testAndroidHostTest :awake:editor:contract:desktopTest

      # Scene document loading, export and the component reference page. The reference test fails
      # when a registered component or field has no row; it drifted while nothing ran it.
      - name: Sprite metadata, animation and scene runtime tests
        run: ./gradlew :awake:asset:sprite:desktopTest :awake:core:animation:desktopTest :awake:tilemap:desktopTest :awake:scene:scene2d:desktopTest :awake:scene:runtime:desktopTest

      # The game UI canvas: its elements' input, drawing and zero-tolerance pixel baselines, in the
      # scene-free capability and its scene wrapper. Before this step it was only compiled here, so a
      # change to how it draws or routes a tap stayed green.
      - name: Game UI canvas tests
        run: ./gradlew :awake:ui:canvas:desktopTest :awake:scene:canvas:desktopTest

      # The committed font atlases and the run-time TTF/OTF loader, held against them: metrics,
      # layout, the distance field, a CFF fixture, corrupt input, and the same text drawn both ways.
      - name: Text and run-time font loading tests
        run: |
          ./gradlew :awake:core:text:desktopTest
          ./gradlew :awake:compose:ui-testing:desktopTest --tests com.awakekt.awake.compose.testing.LoadedFontRasterTest --tests com.awakekt.awake.compose.testing.GradientBackgroundTest

      # Committed browser measurements; CI needs neither Chromium nor Playwright.
      - name: CPU text layout conformance
        run: |
          python3 tools/fonts-tooling/reference_layout.py --verify-inputs
          python3 tools/fonts-tooling/reference_cjk_layout.py --verify-inputs
          ./gradlew :awake:compose:foundation:desktopTest --tests com.awakekt.awake.compose.foundation.text.TextLayoutConformanceTest --tests com.awakekt.awake.compose.foundation.text.CjkLineBreakConformanceTest

      - name: Upload text layout deviations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: text-layout-conformance
          path: awake/compose/foundation/build/reports/text-layout-conformance/
          if-no-files-found: ignore

      # String tables and their layers, ICU-style messages, CLDR plural rules, locale fallback, input
      # labels, the locale font hook, and the Compose glue that reads them.
      - name: Localization tests
        run: ./gradlew :awake:core:localization:desktopTest :awake:compose:localization:desktopTest

      # Includes typed-query allocation probes and family lifecycle tests; compiling them alone
      # cannot catch per-frame allocations or stale wrappers after World.clear().
      - name: ECS runtime and allocation tests
        run: ./gradlew :awake:ecs:desktopTest

      # The particle library and its scene wrapper, the scene's rendering, the render pass logic, and
      # the shaders they draw with: pure JVM suites with no GPU. `ParticleExposureTest` keeps the scene
      # file in step with the library, and until this step it ran only on a contributor's machine
      # (#387). The WebGPU backend and render parity suites need a GPU or the Vulkan natives and are
      # the rest of #387.
      - name: Particle, scene rendering, render pass and shader tests
        run: >-
          ./gradlew
          :awake:core:spatial:desktopTest
          :awake:particles:desktopTest
          :awake:scene:particles:desktopTest
          :awake:scene:scene3d:desktopTest
          :awake:engine:render:passes:desktopTest
          :awake:asset:shader-pack:desktopTest
          :awake:asset:shader-document:desktopTest
          :awake:scene:shader:desktopTest
          :awake:asset:shader-compiler:desktopTest

      # The @SceneBinding processor's compile tests (a missing field, a type with no converter or a
      # scene component with no binding must fail the build) and the golden documents the generated
      # bindings must save byte for byte.
      - name: Scene binding processor and generated binding tests
        run: >-
          ./gradlew
          :awake:scene:binding:processor:test
          :awake:scene:binding:desktopTest
          :awake:scene:scene-core:desktopTest
          :awake:scene:controls:desktopTest
          :awake:scene:audio:desktopTest
          :awake:scene:character:desktopTest
          :awake:scene:navigation:desktopTest
          :awake:scene:worldstream:desktopTest
          :awake:scene:blueprint:desktopTest
          :awake:scene:ai:desktopTest
          :awake:project:blueprint:desktopTest

      - name: Every wasmJs source set compiles
        run: ./gradlew compileKotlinWasmJs compileTestKotlinWasmJs

      # hello-cube (retired) had a dedicated :androidApp wrapper module producing a real
      # installable APK, uploaded below as a regression artifact. ui-showcase only has a KMP
      # `android {}` library target (no application-plugin wrapper module), so this currently
      # builds the Android library AAR, not an installable APK -- a real gap versus hello-cube's
      # old coverage, left open until ui-showcase gets its own :androidApp wrapper.
      - name: Build Android demo APK (Vulkan JNI regression gate)
        run: ./gradlew :samples:engine-showcase:androidApp:assembleDebug

      - name: Build desktop demo
        run: ./gradlew :samples:ui-showcase:desktopJar

      # engine-showcase has complete multiplatform coverage across core ECS, physics, audio,
      # particles and navigation showcases.
      - name: Engine showcase sample (tests and desktop jar)
        run: xvfb-run -a ./gradlew :samples:engine-showcase:desktopTest :samples:engine-showcase:desktopJar

      - name: Upload engine showcase test reports and MSAA probes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-showcase-test-reports
          path: |
            samples/engine-showcase/build/reports/tests/
            samples/engine-showcase/build/reports/msaa/

      - name: Build vulkan generator
        run: ./gradlew :awake:backend:vulkan:generator:assemble

  # Naga builds with cargo, not CMake, so unlike the native libraries above it has no reason
  # to skip Windows for want of a CI job. The published shader-compiler-desktop jar carried only
  # the macOS native for every 0.6.0-0.11.1 release because nothing proved the other hosts also
  # build (#795); this is the PR-time half of that proof, on the same two hosts
  # build-and-publish.yml's naga-desktop matrix collects from for a real release.
  naga-desktop:
    name: Naga desktop (${{ matrix.platform }})
    needs: platform-impact
    if: needs.platform-impact.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x86_64
            lib: awake_naga.dll
          - runner: ubuntu-latest
            platform: linux-x86_64
            lib: libawake_naga.so
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - uses: ./.github/actions/cache-naga
        with:
          variant: desktop
          target-path: awake/asset/shader-compiler/rust-native/target

      - name: Build libawake_naga for this host
        run: ./gradlew :awake:asset:shader-compiler:buildNagaDesktop

      - name: Verify the native library was packaged
        shell: bash
        run: test -f "awake/asset/shader-compiler/build/generated/natives-resources/natives/${{ matrix.platform }}/${{ matrix.lib }}"

  # libawake-window and libawake-vulkan on Windows: the PR-time half of build-and-publish.yml's
  # window-natives and natives matrices, which shipped macOS and Linux alone until a Windows runner
  # built them. Windows builds Release with the C runtime linked in, and GLFW as glfw3.dll beside
  # libawake-window (tools/cmake/glfw.cmake); this proves that tree compiles with MSVC.
  desktop-natives-windows:
    name: Desktop natives (Windows)
    needs: platform-impact
    if: needs.platform-impact.outputs.core == 'true' || needs.platform-impact.outputs.vulkan == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - uses: ./.github/actions/install-vulkan-sdk-windows

      - name: Build libawake-window and libawake-vulkan
        run: ./gradlew :awake:engine:window:buildDesktopNative :awake:backend:vulkan:bindings:buildDesktopNative

      - name: Verify the native libraries were packaged
        shell: bash
        run: |
          for f in awake/engine/window/build/generated/natives-resources/natives/windows-x86_64/awake-window.dll \
                   awake/engine/window/build/generated/natives-resources/natives/windows-x86_64/glfw3.dll \
                   awake/backend/vulkan/bindings/build/generated/natives-resources/natives/windows-x86_64/awake-vulkan.dll; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

  # Runner GPUs aren't available on GitHub-hosted runners, so this uses Mesa's lavapipe
  # (a real, fully-conformant software Vulkan implementation -- not a stub) to run the
  # actual vkCreateInstance/vkDestroyInstance smoke test (VulkanDesktopNativeSmokeTest)
  # headlessly. Separate job (not steps in `build` above) since it needs its own apt
  # packages and is the only job that builds awake:backend:vulkan's desktop-native C++ library.
  desktop-vulkan-smoke:
    name: Vulkan (Linux)
    needs: platform-impact
    if: needs.platform-impact.outputs.vulkan == 'true' || needs.platform-impact.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - uses: ./.github/actions/cache-naga
        with:
          variant: desktop
          target-path: awake/asset/shader-compiler/rust-native/target

      # libvulkan-dev: Vulkan headers + loader, for CMake's find_package(Vulkan) and
      # desktopMain's System.loadLibrary("awake-vulkan") to link/load against at run time.
      # libglfw3-dev: desktop-native/CMakeLists.txt's GLFW dependency (VulkanWindow).
      # mesa-vulkan-drivers: provides lavapipe's ICD (/usr/share/vulkan/icd.d/lvp_icd.*.json)
      # -- with no real GPU on the runner, this becomes the only Vulkan implementation the
      # loader can find, exactly what a headless CI smoke test needs.
      - name: Install desktop Vulkan/GLFW build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libglfw3-dev mesa-vulkan-drivers vulkan-validationlayers xvfb

      - name: Build desktop native Vulkan library
        run: ./gradlew :awake:backend:vulkan:bindings:buildDesktopNative

      # Conformance for the published vulkan-kmp bindings: their own desktop suite
      # (VulkanDesktopNativeSmokeTest and friends) ran nowhere in CI before this step --
      # the renderer's suite exercised them only indirectly.
      - name: vulkan-kmp bindings conformance (lavapipe)
        run: ./gradlew :awake:backend:vulkan:bindings:desktopTest

      - name: Desktop Vulkan smoke test (real vkCreateInstance via lavapipe)
        run: ./gradlew :awake:backend:vulkan:desktopTest

      # wgpu-native needs a GLFW surface to select its adapter, even when rendering offscreen.
      # Xvfb supplies the display; Mesa's lavapipe executes both backends on the hosted runner.
      # Includes WebGpuProductionPlanTest: boots the showcase's real plan via WebGpuEngine,
      # compares its offscreen pixels with geometry alone, and checks that depth fog ran.
      - name: WebGPU production-plan and backend pixel tests (wgpu-native)
        if: ${{ !cancelled() }}
        run: xvfb-run -a ./gradlew :awake:backend:webgpu:desktopTest --stacktrace

      - name: Vulkan and WebGPU render parity tests
        if: ${{ !cancelled() }}
        run: xvfb-run -a ./gradlew :awake:engine:render:parity:desktopTest --stacktrace

      # The awake command line: its GPU-free commands, and `awake render` playing a project headless on
      # both backends. Here because its classpath carries the backends this job builds natives for.
      - name: awake command line, and awake render on Vulkan and WebGPU
        if: ${{ !cancelled() }}
        run: xvfb-run -a ./gradlew :awake:project:cli:test :awake:project:cli:renderTest --stacktrace

      - name: Upload graphics test reports and parity images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphics-test-results
          path: |
            awake/backend/vulkan/build/test-results/desktopTest/
            awake/backend/vulkan/build/reports/tests/desktopTest/
            awake/backend/webgpu/build/test-results/desktopTest/
            awake/backend/webgpu/build/reports/tests/desktopTest/
            awake/engine/render/parity/build/test-results/desktopTest/
            awake/engine/render/parity/build/reports/
          if-no-files-found: warn

  # The only job on a macOS runner, and the only one that can build or run anything for iOS: the
  # iOS natives, cinterop and Kotlin/Native. Verify (verify.yml) runs on Linux and leaves them here.
  # It exists because of measured history, not symmetry: the JoltC backend reached four features
  # deep while aborting on its very first `step` -- a fixed-size temp allocator sized under what
  # Jolt asks for -- and it compiled cleanly throughout. Three of the four physics bugs found on
  # 2026-08-31 were on this binding, which shares no code with any target covered above.
  ios-physics:
    name: Physics (iOS)
    needs: platform-impact
    if: needs.platform-impact.outputs.ios == 'true'
    # Apple silicon, pinned like build-and-publish.yml. Nothing here needs Intel, whose pool is the
    # scarcest and is being retired.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The shared iOS-native action builds both MoltenVK and JoltC from these pinned submodules.
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Install Vulkan tools (macOS)
        run: brew install vulkan-loader molten-vk glfw

      - name: Install Rust iOS simulator target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim

      - uses: ./.github/actions/cache-naga
        with:
          variant: ios-sim
          target-path: awake/asset/shader-compiler/rust-native/target

      - uses: ./.github/actions/ios-native

      - name: Build Naga for the iOS simulator
        run: ./gradlew :awake:asset:shader-compiler:buildNagaIosSimulatorArm64

      - name: Verify Naga native library
        shell: bash
        run: test -f awake/asset/shader-compiler/rust-native/target/aarch64-apple-ios-sim/release/libawake_naga.a

      # The tests below link the simulator slices. This compiles the device cinterops against the
      # device slices the ios-native action just built, which Verify did on Intel before it moved
      # to Linux.
      - name: iOS device cinterop and compile (MoltenVK, JoltC)
        run: ./gradlew :awake:backend:vulkan:bindings:compileKotlinIosArm64 :awake:backend:jolt:compileKotlinIosArm64

      - name: Jolt iOS simulator physics tests
        run: ./gradlew :awake:backend:jolt:iosSimulatorArm64Test :awake:scene:physics:iosSimulatorArm64Test :samples:engine-showcase:iosSimulatorArm64Test

      - name: ECS and sprite iOS simulator tests
        run: ./gradlew :awake:ecs:iosSimulatorArm64Test :awake:asset:sprite:iosSimulatorArm64Test :awake:scene:scene2d:iosSimulatorArm64Test

      # Signature checks through Apple's Security framework and archive inflation through zlib.
      - name: Plugin archive iOS simulator tests
        run: ./gradlew :awake:plugin-archive:iosSimulatorArm64Test

      - name: Upload iOS physics test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-physics-test-results
          path: |
            awake/backend/jolt/build/reports/tests/
            awake/scene/physics/build/reports/tests/
            awake/ecs/build/reports/tests/
            awake/asset/sprite/build/reports/tests/
            awake/scene/scene2d/build/reports/tests/
            samples/engine-showcase/build/reports/tests/
          if-no-files-found: warn

  web-verification:
    name: Web
    needs: platform-impact
    if: needs.platform-impact.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Wasm/WebGPU browser verification (headless Chrome)
        run: ./gradlew :awake:core:audio:wasmJsBrowserTest :samples:ui-showcase:wasmJsBrowserTest :samples:engine-showcase:wasmJsBrowserTest

      - name: ECS and sprite browser tests
        run: ./gradlew :awake:ecs:wasmJsBrowserTest :awake:asset:sprite:wasmJsBrowserTest :awake:scene:scene2d:wasmJsBrowserTest

      # The loader bakes a font in the browser and checks the atlas hash desktop pins: same file, same bytes.
      - name: Font loading browser tests
        run: ./gradlew :awake:core:text:wasmJsBrowserTest

      # Code that only runs in a browser: copying a fetched response into a ByteArray, the
      # IndexedDB content cache, including a store that's full or blocked, and the `fetch()` content
      # transport's real request. Desktop tests can't reach it.
      - name: Project loading browser tests
        run: ./gradlew :awake:core:io:wasmJsBrowserTest :awake:core:host:wasmJsBrowserTest :awake:project:wasmJsBrowserTest :awake:project:transport-browser:wasmJsBrowserTest

      # Plugin signature checks through WebCrypto and archive inflation through DecompressionStream,
      # both asynchronous and both browser-only.
      - name: Plugin archive browser tests
        run: ./gradlew :awake:plugin-archive:wasmJsBrowserTest

      # The only bundle that pulls in Ktor's JS client and kotlinx-io's Node helpers. A toolchain
      # bump once left a bare `import.meta` in it that no build caught, and the page stopped loading.
      - name: Network demo browser tests
        run: ./gradlew :samples:net-demo:wasmJsBrowserTest

      # The physics backend has four bindings and CI only ran one of them. This is the wasmJs
      # binding executing the same commonTest suite as desktop, on the runner already here --
      # it caught a body filter comparing an Emscripten pointer to a body id, which passed on
      # every other target.
      - name: Physics backend verification (wasmJs)
        run: ./gradlew :awake:backend:jolt:wasmJsTest :awake:scene:physics:wasmJsTest

  # The WebGPU release pin is built only from a commit tagged v<release>, and on the tag run its
  # Consumer gate builds it before the release can publish. Without this job a tag would be the
  # first run of that build, its strictly constraints and its metadata check, on Linux at least. A
  # throwaway local tag at this commit gives Gradle the release version; nothing is pushed or
  # uploaded. It runs on the same runner and setup as the Publish run's webgpu-pin job.
  webgpu-release-pin:
    name: WebGPU release pin
    needs: platform-impact
    if: needs.platform-impact.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from `git describe --tags`, which needs the tags.
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Tag this commit as the next release, locally
        id: release
        run: |
          version=$(./gradlew -q :awake:core:math:properties --no-configuration-cache | awk '$1 == "version:" && v == "" { v = $2 } END { print v }')
          base="${version%-SNAPSHOT}"
          git tag -f "v$base"
          echo "version=$base" >> "$GITHUB_OUTPUT"

      - name: Build and verify the pin in Maven Local
        run: bash tools/publish_webgpu_pin.sh --local

      # The throwaway release is not on Central, so the wait itself cannot run; this checks that the
      # task the script calls next resolves with the pin's arguments.
      - name: Resolve the wait for Core on Central
        run: ./gradlew waitForCoreCentral -Pawake.waitForCoreVersion="${{ steps.release.outputs.version }}" --dry-run --no-configuration-cache
