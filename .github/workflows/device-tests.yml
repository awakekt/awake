# Tests that need a running device rather than a JVM, kept out of the per-PR pipeline.
#
# Android is the one physics backend that cannot be covered by a host test at all: jolt-jni's
# Android artifact ships device ABIs and nothing for a JVM host, so `System.loadLibrary("joltjni")`
# has nothing to load and every test fails with UnsatisfiedLinkError. `testAndroidHostTest` is
# disabled in that module for exactly this reason.
#
# Nightly rather than per-PR, deliberately. Android runs jolt-jni -- the same binding the `build`
# job already exercises with the same 44 tests on every push -- so the Android-only surface is
# whether the AAR's natives load and how the ABI behaves, not the physics itself. That is worth
# checking daily and is not worth several minutes of emulator boot, and its attendant flakiness,
# on every change. iOS is the opposite case and runs per-PR in ci.yml: JoltC shares no code with
# anything else, and it is where the bugs have actually been.
name: Device Tests

on:
  schedule:
    # 03:00 UTC. Late enough that a day's merges are in, early enough to read with coffee.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  android-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            target: default
          - api: 36
            target: google_apis

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Without this the emulator falls back to software rendering and takes long enough to trip
      # the job timeout. GitHub's Linux runners expose /dev/kvm but not to the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # x86_64 because the runner is: jolt-jni's AAR ships arm64-v8a, armeabi-v7a, riscv64, x86
      # and x86_64, so the emulator's own architecture is the only constraint.
      # The showcase compiles its shaders through Naga at runtime, so its APK needs libawake_naga.so,
      # which is gitignored build output: build it for the emulator's ABI, as the publish workflow does.
      - name: Build libawake_naga.so for the emulator
        working-directory: awake/asset/shader-compiler/rust-native
        run: |
          rustup target add x86_64-linux-android
          cargo install cargo-ndk --locked
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t x86_64 -o ../src/androidMain/jniLibs build --release

      # Then the engine showcase's release, shrunk by R8 with no keep rules of its own, as a game's
      # is: its startup creates a Jolt physics world and a Vulkan device, so a class or field the
      # natives find by name that the backends' consumer rules miss aborts it here (#601).
      - name: Jolt Android physics tests (instrumented) and a shrunk release's launch
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: |
            ./gradlew :awake:backend:jolt:connectedAndroidDeviceTest :awake:scene:physics:connectedAndroidDeviceTest :samples:engine-showcase:connectedAndroidDeviceTest
            ./gradlew :samples:engine-showcase:androidApp:assembleRelease
            AWAKE_CHECK_RENDERED_UI=1 scripts/android-launch-check.sh samples/engine-showcase/androidApp/build/outputs/apk/release/androidApp-release.apk com.awakekt.awake.showcase.android/.MainActivity 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-test-results-api-${{ matrix.api }}
          path: |
            awake/backend/jolt/build/outputs/androidTest-results/
            awake/scene/physics/build/outputs/androidTest-results/
            samples/engine-showcase/build/outputs/androidTest-results/
            build/android-launch-check/
          if-no-files-found: warn
