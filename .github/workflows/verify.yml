name: Verify

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  verify:
    name: Verify
    # Every gate here is host-independent: the API dumps are `api/desktop/*.api` (JVM, no klib
    # validation), and formatting, the build-logic tests and the repository gates read sources. On
    # Linux the Kotlin plugin disables the iOS targets, so no cinterop or Apple native is built.
    # What needs a Mac -- the iOS natives, cinterop and Kotlin/Native -- is `Physics (iOS)` in ci.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # awakeVerify checks Maven coordinates against the release tags.
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Configuring the build installs the NDK the Vulkan android-native module pins. Install it up
      # front, as the Build (JVM/Native) job does, rather than as a side effect of the first task.
      - name: Install the Android NDK
        run: |
          version=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' awake/backend/vulkan/bindings/android-native/build.gradle.kts)
          test -n "$version" || { echo "::error::No ndkVersion in awake/backend/vulkan/bindings/android-native/build.gradle.kts"; exit 1; }
          # `yes` dies of SIGPIPE once sdkmanager exits, which pipefail would count as a failure.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$version" > /dev/null

      - name: Verify Awake repository gates
        run: ./gradlew awakeVerify --no-configuration-cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The gates' own unit tests (layering checks, changelog fragments, release cut), so a pull request
      # that changes a gate runs them rather than waiting for the push to main.
      - name: Test build logic
        run: ./gradlew -p build-logic test --no-configuration-cache

      - name: Verify API surface
        run: ./gradlew apiCheck

      # Nothing checked formatting before, so main drifted, and every spotlessApply rewrote files a
      # change never touched. An unformatted change now fails here; `./gradlew spotlessApply` fixes it.
      - name: Verify formatting
        run: ./gradlew spotlessCheck
