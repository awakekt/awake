name: Repository Verification

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  verify:
    name: Verify API, docs & Core boundaries
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Vulkan (macOS)
        run: brew install vulkan-loader molten-vk glfw

      - uses: ./.github/actions/ios-native

      - name: Verify Core capability boundaries
        run: python3 tools/verify_capability_boundaries.py

      - name: Verify the publication closure
        run: python3 tools/verify_publication_closure.py

      - name: Verify API surface
        run: ./gradlew apiCheck

      - name: Verify documented Maven coordinates
        run: python3 tools/verify_doc_coordinates.py

      - name: Verify product documentation
        run: python3 tools/verify_project_docs.py

      - name: Verify no product tooling depends on agent bundles
        run: python3 tools/verify_no_agent_runtime_dependencies.py

      - name: Verify PR milestone and changelog policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/verify_pr_governance.py
