name: Repository Verification

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  verify:
    name: Verify API, docs & Core boundaries
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Vulkan (macOS)
        run: brew install vulkan-loader molten-vk glfw

      - uses: ./.github/actions/ios-native

      - name: Verify Awake repository gates
        run: ./gradlew awakeVerify --no-configuration-cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify API surface
        run: ./gradlew apiCheck
