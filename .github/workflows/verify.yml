name: Verify

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  verify:
    name: Verify
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Vulkan (macOS)
        run: brew install vulkan-loader molten-vk glfw

      - uses: ./.github/actions/ios-native

      - name: Verify Awake repository gates
        run: ./gradlew awakeVerify --no-configuration-cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The gates' own unit tests (layering checks, changelog fragments, release cut), so a pull request
      # that changes a gate runs them rather than waiting for the push to main.
      - name: Test build logic
        run: ./gradlew -p build-logic test --no-configuration-cache

      - name: Verify API surface
        run: ./gradlew apiCheck

      # Nothing checked formatting before, so main drifted, and every spotlessApply rewrote files a
      # change never touched. An unformatted change now fails here; `./gradlew spotlessApply` fixes it.
      - name: Verify formatting
        run: ./gradlew spotlessCheck
