name: Render Evidence

# Screenshot evidence for pull requests that can change what the engine draws. Capture the relevant
# UI icons or headless Vulkan scenarios on the base and head, publish both to render-evidence, and
# keep one focused PR comment. A PR that touches nothing rendering-related skips capture.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: render-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # publishes images to the render-evidence branch
  pull-requests: write   # keeps the evidence comment up to date

env:
  JAVA_VERSION: '17'

jobs:
  evidence:
    name: Render evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Decide whether this PR can change a render
        id: scope
        run: |
          if [[ -z "$PR" ]]; then echo "render=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "::notice::Fork PRs cannot publish evidence images; skipping."
            echo "render=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          product="$(grep -E '^(awake|samples|build-logic)/' <<<"$changed" | grep -vE '\.md$' || true)"
          if [[ -z "$product" ]]; then
            echo "::notice::No engine, sample or build-logic changes; nothing to render."
            echo "render=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "render=true" >> "$GITHUB_OUTPUT"
          icon_paths='^awake/(ui/shadcn|core/graphics2d)/|^build-logic/src/main/kotlin/com/awakekt/awake/build/icons/|^awake/compose/ui/src/commonMain/kotlin/com/awakekt/awake/compose/ui/graphics/vector/'
          # graphics2d also draws every 2D and UI scene, so it counts toward both sets.
          icon_only_paths='^awake/ui/shadcn/|^build-logic/src/main/kotlin/com/awakekt/awake/build/icons/|^awake/compose/ui/src/commonMain/kotlin/com/awakekt/awake/compose/ui/graphics/vector/'
          if grep -qE "$icon_paths" <<<"$product"; then
            echo "icons=true" >> "$GITHUB_OUTPUT"
          else
            echo "icons=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -vE "$icon_only_paths" <<<"$product" | grep -q .; then
            echo "scenes=true" >> "$GITHUB_OUTPUT"
          else
            echo "scenes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK
        if: steps.scope.outputs.render == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (with cache)
        if: steps.scope.outputs.render == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare capture directories
        if: steps.scope.outputs.render == 'true'
        run: mkdir -p "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"

      - uses: ./.github/actions/cache-naga
        if: steps.scope.outputs.scenes == 'true'
        with:
          variant: desktop
          target-path: awake/asset/shader-compiler/rust-native/target

      - name: Install Vulkan (lavapipe) and GLFW
        if: steps.scope.outputs.scenes == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libglfw3-dev mesa-vulkan-drivers

      - name: Render head
        if: steps.scope.outputs.scenes == 'true'
        run: ./gradlew :awake:engine:render:parity:captureRenderEvidence -Pevidence.dir="$RUNNER_TEMP/after"

      - name: Capture icon previews on head
        if: steps.scope.outputs.icons == 'true'
        run: |
          ./gradlew :awake:ui:shadcn:desktopTest \
            --tests '*ShadcnComposeRenderPreview.buttonIconsRenderThePinnedLucideGlyphs' \
            --tests '*LucideShadcnSpritesheetPreviewTest*'
          cp awake/ui/shadcn/build/reports/compose-preview/button-icons.png "$RUNNER_TEMP/after/ui-button-icons-cpu.png"
          cp awake/ui/shadcn/build/reports/compose-preview/lucide-icons.png "$RUNNER_TEMP/after/ui-lucide-icons-cpu.png"
          cp awake/ui/shadcn/build/reports/compose-preview/shadcn-icons.png "$RUNNER_TEMP/after/ui-shadcn-icons-cpu.png"

      - name: Setup Python for original SVG capture
        if: steps.scope.outputs.icons == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Capture pinned original SVGs in Chromium
        if: steps.scope.outputs.icons == 'true'
        run: |
          python -m pip install 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
          python tools/icons/capture_lucide_spritesheet_reference.py \
            --out "$RUNNER_TEMP/after/ui-original-svg-browser.png"

      - name: Checkout base
        if: steps.scope.outputs.render == 'true'
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"

      - name: Render base
        if: steps.scope.outputs.scenes == 'true'
        run: |
          cd "$RUNNER_TEMP/base"
          if [[ ! -f awake/engine/render/parity/src/desktopMain/kotlin/com/awakekt/awake/render/parity/RenderEvidence.kt ]]; then
            echo "::notice::The base has no evidence capture; showing every image as new."
            exit 0
          fi
          # Reuse the head's naga build: cargo output is what the head just used.
          mkdir -p awake/asset/shader-compiler/rust-native
          cp -R "$GITHUB_WORKSPACE/awake/asset/shader-compiler/rust-native/target" awake/asset/shader-compiler/rust-native/ || true
          ./gradlew :awake:engine:render:parity:captureRenderEvidence -Pevidence.dir="$RUNNER_TEMP/before" \
            || echo "::warning::The base failed to render; showing every image as new."

      - name: Capture icon previews on base
        if: steps.scope.outputs.icons == 'true'
        run: |
          cd "$RUNNER_TEMP/base"
          # Run the exact same capture harness on both commits, including bases that predate it.
          cp "$GITHUB_WORKSPACE/awake/ui/shadcn/src/desktopTest/kotlin/com/awakekt/awake/ui/shadcn/LucideShadcnSpritesheetPreviewTest.kt" \
            awake/ui/shadcn/src/desktopTest/kotlin/com/awakekt/awake/ui/shadcn/
          ./gradlew :awake:ui:shadcn:desktopTest \
            --tests '*ShadcnComposeRenderPreview.buttonIconsRenderThePinnedLucideGlyphs' \
            --tests '*LucideShadcnSpritesheetPreviewTest*'
          cp awake/ui/shadcn/build/reports/compose-preview/button-icons.png "$RUNNER_TEMP/before/ui-button-icons-cpu.png"
          cp awake/ui/shadcn/build/reports/compose-preview/lucide-icons.png "$RUNNER_TEMP/before/ui-lucide-icons-cpu.png"
          cp awake/ui/shadcn/build/reports/compose-preview/shadcn-icons.png "$RUNNER_TEMP/before/ui-shadcn-icons-cpu.png"

      - name: Publish images
        if: steps.scope.outputs.render == 'true'
        run: |
          dest="pr-$PR/$HEAD_SHA"
          publish="$RUNNER_TEMP/publish"
          if git ls-remote --exit-code --heads origin render-evidence >/dev/null; then
            git fetch --depth 1 origin render-evidence
            git worktree add "$publish" FETCH_HEAD
            git -C "$publish" switch -c render-evidence
          else
            git worktree add --detach "$publish"
            git -C "$publish" switch --orphan render-evidence
          fi
          mkdir -p "$publish/$dest"
          cp -R "$RUNNER_TEMP/before" "$publish/$dest/before"
          cp -R "$RUNNER_TEMP/after" "$publish/$dest/after"
          cd "$publish"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -q -m "Render evidence for #$PR at ${HEAD_SHA:0:9}"
          # Other PRs publish to the same branch; rebase onto theirs and retry.
          for attempt in 1 2 3 4 5; do
            git push origin render-evidence && exit 0
            git pull -q --rebase origin render-evidence
          done
          exit 1

      - name: Post comparison
        if: steps.scope.outputs.render == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_FOCUS: ${{ steps.scope.outputs.scenes == 'false' && 'icons' || 'all' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          prefix="https://raw.githubusercontent.com/${{ github.repository }}/render-evidence/pr-$PR/$HEAD_SHA"
          scripts/render-evidence-comment.sh "$RUNNER_TEMP/before" "$RUNNER_TEMP/after" "$prefix" "$HEAD_SHA" "$EVIDENCE_FOCUS" > "$RUNNER_TEMP/comment.md"
          scripts/baseline-diff-comment.sh "$BASE_SHA" "$HEAD_SHA" "${{ github.repository }}" > "$RUNNER_TEMP/baselines.md"
          if [[ -s "$RUNNER_TEMP/baselines.md" ]]; then
            if [[ ! -s "$RUNNER_TEMP/comment.md" ]]; then
              printf '<!-- render-evidence -->\n## Render evidence\n' > "$RUNNER_TEMP/comment.md"
            fi
            { echo; cat "$RUNNER_TEMP/baselines.md"; } >> "$RUNNER_TEMP/comment.md"
          fi
          existing="$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- render-evidence -->")) | .id] | first // empty')"
          if [[ ! -s "$RUNNER_TEMP/comment.md" && "$PR_TITLE" =~ ^fix(\(.*\))?!?: ]]; then
            # A fix that moves no captured pixel was most likely never captured; say so rather
            # than let silence read as "no visible change".
            {
              echo '<!-- render-evidence -->'
              echo '## Render evidence'
              echo 'No captured scenario changed. If this fix changes what the engine draws, add a scenario to `RenderEvidence.kt` (or a baseline) that shows the bug on the base and not on the head. If it cannot be captured headless, say why in the PR body.'
            } > "$RUNNER_TEMP/comment.md"
          fi
          if [[ ! -s "$RUNNER_TEMP/comment.md" ]]; then
            # No render changed. Drop an earlier comment that a later push made stale.
            echo "::notice::No render changed; no evidence comment."
            if [[ -n "$existing" ]]; then
              gh api --method DELETE "repos/${{ github.repository }}/issues/comments/$existing"
            fi
          elif [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          fi

      - name: Upload captures
        if: steps.scope.outputs.render == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: render-evidence-pr${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/before
            ${{ runner.temp }}/after
          retention-days: 14
