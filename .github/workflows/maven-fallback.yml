name: Maven fallback

# Serves recent Core and Vulkan releases as a static Maven repository on GitHub Pages,
# https://awakekt.github.io/awake/, and additively mirrors them to Cloudflare R2
# (https://maven.awakekt.com/, bucket `awake-maven`) for releases Maven Central refuses under its
# publishing limits:
# - GitHub Pages serves the newest CORE_RELEASES Core and VULKAN_RELEASES Vulkan releases, plus
#   every release their POMs name (#1694), and the io.ygdrasil (wgpu4k) snapshot builds the WebGPU
#   backend pins from mirror-io.ygdrasil-*.
# - Cloudflare R2 syncs additively (without deleting older versions) so consumers pinned to older
#   Core or Vulkan releases never hit 404 when newer releases rotate out of GitHub Pages' 1 GB cap.
#
# It runs once a Publish run finishes, from the default branch: workflow_run always does, and the
# github-pages environment deploys only from there, whatever tag the release ran on. A Publish run
# Central refused still counts; its bundle is attached whenever it was built. A release-cut pull
# request's rehearsal of Publish (a `pull_request` run) attaches nothing, so it starts nothing here.
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:
    inputs:
      backfill_r2:
        description: 'Backfill the newest 20 Core and 20 Vulkan releases into Cloudflare R2 (awake-maven)'
        required: false
        type: boolean
        default: false

concurrency:
  group: maven-fallback
  cancel-in-progress: false

permissions:
  contents: read

# What the GitHub Pages site keeps, in one place. A deploy publishes the site whole, replacing the
# one before, so these decide what stays served on awakekt.github.io/awake. GitHub Pages caps a
# site at 1 GB. After bundle trimming, each Core release is ~75 MB unpacked (~91 MB on disk) and
# each Vulkan release ~50 MB unpacked (~52 MB on disk): 3 Core + 3 Vulkan + 42 MB partial Core +
# wgpu4k measured 501 MB total (`du -sm`, run 45509264986). Keeping 6 Core + 4 Vulkan + wgpu4k fits
# around ~770 MB on disk — safely below ASSEMBLE_LIMIT_MB (900 MB) and SITE_LIMIT_MB (950 MB) while
# keeping consumers several releases behind working during Central quota windows.
env:
  CORE_RELEASES: 6
  VULKAN_RELEASES: 4
  ASSEMBLE_LIMIT_MB: 900
  SITE_LIMIT_MB: 950
  R2_BUCKET: awake-maven
  R2_PUBLIC_URL: https://maven.awakekt.com/

jobs:
  deploy:
    name: Deploy
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read     # lists this run's artifacts, to wait for the site's before deploying it
      pages: write      # deploy-pages publishes the site
      id-token: write   # deploy-pages proves the run's identity to Pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the repository from the newest releases and every release they name
        id: bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails, and so keeps the live site, when a served POM names what no bundle holds, or over the limit.
          scripts/maven-fallback-assemble.sh build/maven-fallback "$CORE_RELEASES" "$VULKAN_RELEASES" "$ASSEMBLE_LIMIT_MB"
          echo "count=$(find build/maven-fallback -name '*.pom' | wc -l)" >> "$GITHUB_OUTPUT"

      # Central's own files at Central's paths, maven-metadata.xml included, so they go in after the
      # site is built: the site script would write release metadata over a snapshot's.
      - name: Add the wgpu4k mirror
        if: steps.bundles.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release, through REST and every page: `gh release list --limit 100` stopped finding
          # mirror-io.ygdrasil-20260716 once it was the 101st newest (vulkan-v0.1.67's deploy, 21 Nov),
          # and the check below then reported every pinned file missing. Listed apart from the filter,
          # so a failed listing fails the step instead of serving no mirror.
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')"
          tags="$(grep -E '^mirror-io\.ygdrasil-' <<< "$releases" || true)"
          if [ -z "$tags" ]; then
            echo "::error::No mirror-io.ygdrasil-* release among the $(wc -l <<< "$releases") releases; the site would lose the WebGPU pins."
            exit 1
          fi
          for tag in $tags; do
            gh release download "$tag" --pattern 'io-ygdrasil-*-maven.zip' --dir build/mirrors
            echo "Serving $tag"
          done
          for zip in build/mirrors/*.zip; do
            [ -e "$zip" ] || continue
            unzip -q -o "$zip" -d build/maven-fallback
          done
          # Fails the deploy, and so keeps the live site, if the site would lose a pinned build.
          scripts/check-ygdrasil-mirror.sh build/maven-fallback

      - name: Check the site's size
        if: steps.bundles.outputs.count != '0'
        run: |
          size="$(du -sm build/maven-fallback | cut -f 1)"
          echo "The site is $size MB (limit $SITE_LIMIT_MB MB)."
          if [ "$size" -gt "$SITE_LIMIT_MB" ]; then
            echo "::error::The site would be $size MB, over $SITE_LIMIT_MB MB; lower CORE_RELEASES or VULKAN_RELEASES."
            exit 1
          fi

      # One artifact name per attempt: a re-run uploads its own, and deploy-pages refuses a run that
      # holds two of one name, so under the default name a failed deploy could never be re-run
      # (run 44811365365, attempt 2: "Multiple artifacts named github-pages").
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.bundles.outputs.count != '0'
        with:
          path: build/maven-fallback
          name: github-pages-${{ github.run_attempt }}

      # deploy-pages looks the artifact up once, at once. GitHub can list it a moment after its upload
      # is finalized: run 44811365365's first attempt asked 0.4 s later and found none.
      - name: Wait until the site's artifact is listed
        if: steps.bundles.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for _ in $(seq 1 30); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT" --jq '.total_count' || echo 0)"
            [ "$count" -ge 1 ] && { echo "$ARTIFACT is listed."; exit 0; }
            sleep 2
          done
          echo "::error::$ARTIFACT was not listed 60 s after its upload."
          exit 1

      - id: deploy
        if: steps.bundles.outputs.count != '0'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # What the site now serves, from its own URL: every POM a served POM names must resolve there.
      - name: Check the deployed site resolves what it serves
        if: steps.bundles.outputs.count != '0'
        run: |
          missing="$(scripts/maven-fallback-closure.sh --live "${{ steps.deploy.outputs.page_url }}" build/maven-fallback)"
          if [ -n "$missing" ]; then
            echo "::error::The deployed site does not serve what its POMs name:"
            echo "$missing"
            exit 1
          fi

      # Additive mirror into Cloudflare R2 (https://maven.awakekt.com/): never deletes older versions,
      # so consumers pinned to older releases never break when GitHub Pages rotates past its 1 GB cap.
      - name: Mirror to Cloudflare R2 (maven.awakekt.com)
        if: steps.bundles.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_KEY }}
          AWS_DEFAULT_REGION: auto
          BACKFILL_R2: ${{ inputs.backfill_r2 == true }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice::Skipping Cloudflare R2 mirror (${R2_PUBLIC_URL}): set CLOUDFLARE_R2_ID and CLOUDFLARE_R2_KEY secrets on this repository to enable zero-eviction R2 mirroring."
            exit 0
          fi

          r2_src="build/maven-fallback"
          if [ "$BACKFILL_R2" = "true" ]; then
            echo "Assembling expanded backfill bundle (20 Core + 20 Vulkan) for R2..."
            MAVEN_FALLBACK_URL="$R2_PUBLIC_URL" scripts/maven-fallback-assemble.sh build/maven-r2 20 20
            for zip in build/mirrors/*.zip; do
              [ -e "$zip" ] || continue
              unzip -q -o "$zip" -d build/maven-r2
            done
            r2_src="build/maven-r2"
          fi

          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws --endpoint-url "$endpoint" s3 sync "$r2_src/" "s3://${R2_BUCKET}/" \
            --size-only --no-progress \
            --exclude "index.html" --exclude "*/maven-metadata.xml*" \
            --cache-control "public, max-age=31536000, immutable"
          aws --endpoint-url "$endpoint" s3 sync "$r2_src/" "s3://${R2_BUCKET}/" \
            --no-progress \
            --exclude "*" --include "index.html" --include "*/maven-metadata.xml*" \
            --cache-control "public, max-age=60"
          echo "Mirrored Maven fallback additively to ${R2_PUBLIC_URL} (bucket ${R2_BUCKET})."
