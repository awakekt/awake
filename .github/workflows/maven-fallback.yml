name: Maven fallback

# Serves recent Core and Vulkan releases as a static Maven repository on GitHub Pages,
# https://awakekt.github.io/awake/, for a release Maven Central refuses under its publishing limits:
# the newest CORE_RELEASES Core and VULKAN_RELEASES Vulkan releases, plus every release their POMs
# name (#1694). A Vulkan release imports the Core BOM, and depends on Core artifacts, of the Core
# release it was built against, so that release is kept for as long as the Vulkan release is. It also serves the io.ygdrasil (wgpu4k) snapshot builds the WebGPU
# backend pins, from the mirror-io.ygdrasil-* releases, once Central's snapshot cleanup removes them.
# The files are the ones the release job signed and staged for Central and attached to each GitHub
# Release, so they keep Central's coordinates and a build adds this repository after mavenCentral().
#
# It runs once a Publish run finishes, from the default branch: workflow_run always does, and the
# github-pages environment deploys only from there, whatever tag the release ran on. A Publish run
# Central refused still counts; its bundle is attached whenever it was built. A release-cut pull
# request's rehearsal of Publish (a `pull_request` run) attaches nothing, so it starts nothing here.
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: maven-fallback
  cancel-in-progress: false

permissions:
  contents: read

# What the site keeps, in one place. A deploy publishes the site whole, replacing the one before, so
# these decide what stays served. GitHub Pages caps a site at 1 GB. Unpacked, a Core bundle is about
# 180 MB and a Vulkan bundle about 75 MB, so 2 Core + 3 Vulkan served whole is about 590 MB. Of the
# Core releases those Vulkan releases name, only the artifacts they name are served, not the bundle:
# serving them whole made 7 bundles, 950 MB, before the wgpu4k mirror's 20 MB (#1694).
# ASSEMBLE_LIMIT_MB stops the build, with each release's size, leaving room for the mirror;
# SITE_LIMIT_MB stops a deploy before Pages would refuse it.
env:
  CORE_RELEASES: 2
  VULKAN_RELEASES: 3
  ASSEMBLE_LIMIT_MB: 900
  SITE_LIMIT_MB: 950

jobs:
  deploy:
    name: Deploy
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # deploy-pages publishes the site
      id-token: write   # deploy-pages proves the run's identity to Pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the repository from the newest releases and every release they name
        id: bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails, and so keeps the live site, when a served POM names what no bundle holds, or over the limit.
          scripts/maven-fallback-assemble.sh build/maven-fallback "$CORE_RELEASES" "$VULKAN_RELEASES" "$ASSEMBLE_LIMIT_MB"
          echo "count=$(find build/maven-fallback -name '*.pom' | wc -l)" >> "$GITHUB_OUTPUT"

      # Central's own files at Central's paths, maven-metadata.xml included, so they go in after the
      # site is built: the site script would write release metadata over a snapshot's.
      - name: Add the wgpu4k mirror
        if: steps.bundles.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Listed apart from the filter, so a failed listing fails the step instead of serving no mirror.
          releases="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"
          tags="$(grep -E '^mirror-io\.ygdrasil-' <<< "$releases" || true)"
          for tag in $tags; do
            gh release download "$tag" --pattern 'io-ygdrasil-*-maven.zip' --dir build/mirrors
            echo "Serving $tag"
          done
          for zip in build/mirrors/*.zip; do
            [ -e "$zip" ] || continue
            unzip -q -o "$zip" -d build/maven-fallback
          done
          # Fails the deploy, and so keeps the live site, if the site would lose a pinned build.
          scripts/check-ygdrasil-mirror.sh build/maven-fallback

      - name: Check the site's size
        if: steps.bundles.outputs.count != '0'
        run: |
          size="$(du -sm build/maven-fallback | cut -f 1)"
          echo "The site is $size MB (limit $SITE_LIMIT_MB MB)."
          if [ "$size" -gt "$SITE_LIMIT_MB" ]; then
            echo "::error::The site would be $size MB, over $SITE_LIMIT_MB MB; lower CORE_RELEASES or VULKAN_RELEASES."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.bundles.outputs.count != '0'
        with:
          path: build/maven-fallback

      - id: deploy
        if: steps.bundles.outputs.count != '0'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # What the site now serves, from its own URL: every POM a served POM names must resolve there.
      - name: Check the deployed site resolves what it serves
        if: steps.bundles.outputs.count != '0'
        run: |
          missing="$(scripts/maven-fallback-closure.sh --live "${{ steps.deploy.outputs.page_url }}" build/maven-fallback)"
          if [ -n "$missing" ]; then
            echo "::error::The deployed site does not serve what its POMs name:"
            echo "$missing"
            exit 1
          fi
