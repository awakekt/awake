name: Maven fallback

# Serves the newest two Core releases and the newest two Vulkan releases as a static Maven
# repository on GitHub Pages, https://awakekt.github.io/awake/, for a release Maven Central refuses
# under its publishing limits. It also serves the io.ygdrasil (wgpu4k) snapshot builds the WebGPU
# backend pins, from the mirror-io.ygdrasil-* releases, once Central's snapshot cleanup removes them.
# The files are the ones the release job signed and staged for Central and attached to each GitHub
# Release, so they keep Central's coordinates and a build adds this repository after mavenCentral().
#
# It runs once a Publish run finishes, from the default branch: workflow_run always does, and the
# github-pages environment deploys only from there, whatever tag the release ran on. A Publish run
# Central refused still counts; its bundle is attached whenever it was built.
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: maven-fallback
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.event.workflow_run.head_branch, 'v')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # deploy-pages publishes the site
      id-token: write   # deploy-pages proves the run's identity to Pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the newest two bundles of each family
        id: bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Core releases (v*) and Vulkan releases (vulkan-v*) version independently, so each keeps
          # its own newest two. A release from before the fallback existed has no bundle and is skipped.
          tags="$(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName')"
          fetch() { # family tag-regex asset-glob
            mkdir -p "build/bundles/$1"
            for tag in $(grep -E "$2" <<< "$tags"); do
              gh release download "$tag" --pattern "$3" --dir "build/bundles/$1" 2> /dev/null || continue
              echo "Serving $tag"
              if [ "$(ls "build/bundles/$1" | wc -l)" -ge 2 ]; then break; fi
            done
          }
          fetch core '^v[0-9]' 'awake-[0-9]*-maven.zip'
          fetch vulkan '^vulkan-v[0-9]' 'awake-vulkan-*-maven.zip'
          echo "count=$(find build/bundles -name '*.zip' | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Build the repository
        if: steps.bundles.outputs.count != '0'
        run: scripts/maven-fallback-site.sh build/maven-fallback $(find build/bundles -name '*.zip' | sort)

      # Central's own files at Central's paths, maven-metadata.xml included, so they go in after the
      # site is built: the site script would write release metadata over a snapshot's.
      - name: Add the wgpu4k mirror
        if: steps.bundles.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Listed apart from the filter, so a failed listing fails the step instead of serving no mirror.
          releases="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"
          tags="$(grep -E '^mirror-io\.ygdrasil-' <<< "$releases" || true)"
          for tag in $tags; do
            gh release download "$tag" --pattern 'io-ygdrasil-*-maven.zip' --dir build/mirrors
            echo "Serving $tag"
          done
          for zip in build/mirrors/*.zip; do
            [ -e "$zip" ] || continue
            unzip -q -o "$zip" -d build/maven-fallback
          done
          # Fails the deploy, and so keeps the live site, if the site would lose a pinned build.
          scripts/check-ygdrasil-mirror.sh build/maven-fallback

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.bundles.outputs.count != '0'
        with:
          path: build/maven-fallback

      - id: deploy
        if: steps.bundles.outputs.count != '0'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
