name: PR body footer

# The owner's rule: no "Generated by" attribution in pull request descriptions, issues or comments. A
# cloud agent session writes through a connection that appends `_Generated by [Claude Code](...)_` to
# every write, and an edit from that same session puts it back, so the line is removed here instead:
# this job edits with the workflow's own token, outside that connection. An edit made with
# GITHUB_TOKEN starts no workflow, so this never triggers itself.
#
# The review events run with the pull request's own token, which a fork's is read-only, so a fork's reviews are
# left alone rather than failing the job.
#
# pull_request_target runs this workflow from main with a write token. It never checks out or runs
# the PR's code: it reads and writes a description, issue or comment through the GitHub API and
# nothing else.
on:
  pull_request_target:
    types: [opened, edited, reopened]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read

jobs:
  strip:
    name: Strip generated footer
    if: >-
      (
        contains(github.event.review.body || github.event.comment.body || github.event.issue.body || github.event.pull_request.body, 'Generated by [Claude Code]') ||
        contains(github.event.review.body || github.event.comment.body || github.event.issue.body || github.event.pull_request.body, 'Generated with [Claude Code]') ||
        contains(github.event.review.body || github.event.comment.body || github.event.issue.body || github.event.pull_request.body, 'claude.ai/code/session_')
      ) && (
        (github.event_name != 'pull_request_review' && github.event_name != 'pull_request_review_comment') ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Remove the generated attribution
        env:
          GH_TOKEN: ${{ github.token }}
          # The one thing this event wrote: a comment, a review, a review comment, a PR's description or an issue's body.
          TARGET: >-
            ${{ github.event_name == 'issue_comment' && format('issues/comments/{0}', github.event.comment.id)
            || github.event_name == 'pull_request_review_comment' && format('pulls/comments/{0}', github.event.comment.id)
            || github.event_name == 'pull_request_review' && format('pulls/{0}/reviews/{1}', github.event.pull_request.number, github.event.review.id)
            || github.event_name == 'pull_request_target' && format('pulls/{0}', github.event.pull_request.number)
            || format('issues/{0}', github.event.issue.number) }}
          # A review's body is replaced with PUT; everything else is edited with PATCH.
          METHOD: ${{ github.event_name == 'pull_request_review' && 'PUT' || 'PATCH' }}
        run: |
          # GitHub answers an edit made seconds after the write it follows with an error page now and then, which is
          # not JSON and failed the job; each call is tried three times.
          retry() { for attempt in 1 2 3; do "$@" && return 0; sleep $((attempt * 5)); done; return 1; }
          fetch() { gh api "repos/$GITHUB_REPOSITORY/$TARGET" --jq '.body // ""' > body.md; }
          retry fetch
          cp body.md before.md
          python3 - body.md <<'PY'
          import re
          import sys

          path = sys.argv[1]
          body = open(path, encoding="utf-8").read()
          cleaned = body
          # The appended block: an optional rule, then the attribution line.
          cleaned = re.sub(
              r"\n*(?:-{3,}\n+)?_?(?:🤖 )?Generated (?:by|with) \[Claude Code\]\([^)]*\)_?[^\n]*\n?",
              "\n",
              cleaned,
          )
          cleaned = re.sub(r"\n*https://claude\.ai/code/session_[A-Za-z0-9]+[^\n]*\n?", "\n", cleaned)
          cleaned = cleaned.rstrip() + "\n"
          open(path, "w", encoding="utf-8").write(cleaned)
          print(f"removed {len(body) - len(cleaned)} characters")
          PY
          if cmp -s body.md before.md; then echo "nothing to remove"; exit 0; fi
          # A review may not be left with an empty body by this call; one that was only the footer keeps a dash.
          [ -s body.md ] && [ "$(tr -d '[:space:]' < body.md)" != "" ] || printf -- '-\n' > body.md
          retry gh api -X "$METHOD" "repos/$GITHUB_REPOSITORY/$TARGET" -F body=@body.md --jq .id
