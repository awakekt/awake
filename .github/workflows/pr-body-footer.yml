name: PR body footer

# The owner's rule: no "Generated by" attribution in pull request descriptions, issues or comments. A
# cloud agent session writes through a connection that appends `_Generated by [Claude Code](...)_` to
# every write, and an edit from that same session puts it back, so the line is removed here instead:
# this job edits with the workflow's own token, outside that connection. An edit made with
# GITHUB_TOKEN starts no workflow, so this never triggers itself.
#
# pull_request_target runs this workflow from main with a write token. It never checks out or runs
# the PR's code: it reads and writes a description, issue or comment through the GitHub API and
# nothing else.
on:
  pull_request_target:
    types: [opened, edited, reopened]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  strip:
    name: Strip generated footer
    if: >-
      contains(github.event.pull_request.body || github.event.comment.body || github.event.issue.body, 'Generated by [Claude Code]') ||
      contains(github.event.pull_request.body || github.event.comment.body || github.event.issue.body, 'Generated with [Claude Code]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Remove the generated attribution
        env:
          GH_TOKEN: ${{ github.token }}
          # The one thing this event wrote: a comment, a PR's description or an issue's body.
          TARGET: >-
            ${{ github.event_name == 'issue_comment' && format('issues/comments/{0}', github.event.comment.id)
            || github.event_name == 'pull_request_target' && format('pulls/{0}', github.event.pull_request.number)
            || format('issues/{0}', github.event.issue.number) }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/$TARGET" --jq .body > body.md
          python3 - body.md <<'PY'
          import re
          import sys

          path = sys.argv[1]
          body = open(path, encoding="utf-8").read()
          cleaned = body
          # The appended block: an optional rule, then the attribution line.
          cleaned = re.sub(
              r"\n*(?:-{3,}\n+)?_?(?:🤖 )?Generated (?:by|with) \[Claude Code\]\([^)]*\)_?[^\n]*\n?",
              "\n",
              cleaned,
          )
          cleaned = re.sub(r"\n*https://claude\.ai/code/session_[A-Za-z0-9]+[^\n]*\n?", "\n", cleaned)
          cleaned = cleaned.rstrip() + "\n"
          open(path, "w", encoding="utf-8").write(cleaned)
          print(f"removed {len(body) - len(cleaned)} characters")
          PY
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/$TARGET" -F body=@body.md --jq .id
