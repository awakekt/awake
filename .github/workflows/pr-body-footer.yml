name: PR body footer

# The owner's rule: no "Generated by" attribution in pull request descriptions. A cloud agent session
# writes PR bodies through a connection that appends `_Generated by [Claude Code](...)_` to every
# write, and an edit from that same session puts it back, so the line is removed here instead: this
# job edits with the workflow's own token, outside that connection. An edit made with GITHUB_TOKEN
# starts no workflow, so this never triggers itself.
#
# pull_request_target runs this workflow from main with a write token. It never checks out or runs
# the PR's code: it reads and writes the PR's description through the GitHub API and nothing else.
on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  strip:
    name: Strip generated footer
    if: contains(github.event.pull_request.body, 'Generated by [Claude Code]') || contains(github.event.pull_request.body, 'Generated with [Claude Code]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Remove the generated attribution from the description
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .body > body.md
          python3 - body.md <<'PY'
          import re
          import sys

          path = sys.argv[1]
          body = open(path, encoding="utf-8").read()
          cleaned = body
          # The appended block: an optional rule, then the attribution line.
          cleaned = re.sub(
              r"\n*(?:-{3,}\n+)?_?(?:🤖 )?Generated (?:by|with) \[Claude Code\]\([^)]*\)_?[^\n]*\n?",
              "\n",
              cleaned,
          )
          cleaned = re.sub(r"\n*https://claude\.ai/code/session_[A-Za-z0-9]+[^\n]*\n?", "\n", cleaned)
          cleaned = cleaned.rstrip() + "\n"
          open(path, "w", encoding="utf-8").write(cleaned)
          print(f"removed {len(body) - len(cleaned)} characters")
          PY
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" -F body=@body.md --jq .number
