# build-logic's tests on macOS, for a pull request that changes build-logic. Verify (verify.yml) runs
# them on Linux for every pull request, and the release builds with build-logic on macOS, so a test
# that fails only on macOS reached the tag first: 0.36.0's did (a file order only macOS returned,
# #1278), and the version was spent (#1285). The publish run's Verify runs on Linux too, so this is
# where build-logic meets macOS before a release.
name: Build logic (macOS)

on:
  pull_request:
    paths:
      - build-logic/**
      - gradle/git-derived-version.gradle.kts
      - .github/workflows/build-logic-macos.yml
  workflow_dispatch:

concurrency:
  group: build-logic-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  test:
    name: Build logic tests (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release-cut tests and the derived version read the tags.
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # `-p build-logic` configures build-logic alone, so neither the NDK nor the iOS toolchain is needed.
      - name: Test build logic
        run: ./gradlew -p build-logic test --no-configuration-cache
