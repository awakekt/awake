name: Release

# Manual Core release. `main` only accepts pull requests, so a release is two steps:
#   1. Run this workflow: it promotes CHANGELOG.md with `releaseCut` and opens a release PR.
#   2. Merge that PR: the push to `main` tags the squash commit, and the tag triggers Publish, whose
#      Vulkan tag job pushes the next `vulkan-v*` tag when one is needed.
# Both steps run release-reusable.yml, the workflow every other repository calls too
# (docs/templates/release.yml), so Core is its first consumer. RELEASE_TOKEN is explained there.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        default: dev
        type: choice
        options: [dev, alpha, beta, rc, stable]
      bump:
        description: 'Version bump (none keeps the current base version)'
        required: true
        default: none
        type: choice
        options: [none, patch, minor, major]
      dry-run:
        description: 'Print the next version and changelog; push and open nothing'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-reusable.yml
    with:
      channel: ${{ inputs.channel || 'dev' }}
      bump: ${{ inputs.bump || 'none' }}
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
