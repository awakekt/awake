[versions]
kotlin = "2.4.20"
agp = "9.2.1"
detekt = "1.23.8"
spotless = "7.0.2"
dokka = "2.0.0"
fleks = "2.14"
artemis-odb = "2.3.0"
ashley = "1.7.3"
kotlinx-benchmark = "0.4.17"
kover = "0.9.8"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.10.2"
kotlinx-atomicfu = "0.27.0"
kotlinx-browser = "0.5.0"
napier = "2.7.1"
androidx-core-ktx = "1.15.0"
leakcanary = "2.14"
# vanniktech-publish is applied directly in awake-core/build.gradle.kts.
vanniktech-publish = "0.37.0"
binary-compat = "0.17.0"
# Phase 2.5 (Web/WebGPU) spike -- no stable release yet (last tag v0.1.1, June 2025), this
# is a Sonatype snapshot build (see settings.gradle.kts's snapshot repo addition). The exact
# builds every io.ygdrasil SNAPSHOT resolves to are pinned in the root build.gradle.kts.
wgpu4k = "0.2.0-SNAPSHOT"
# Descriptor types (BufferDescriptor, BindGroupDescriptor, ...). On wasmJs these arrive via
# wgpu4k-toolkit; the toolkit is wasm-only, so the desktop test target needs them declared.
webgpu-ktypes = "0.0.10-SNAPSHOT"
# Jolt Physics integration slice 1 (see docs/MVP_PLAN.md's decision log) -- stephengold's
# jolt-jni provides JVM bindings for desktop+Android. 6.x, not 5.x: 5.1.0 and 5.2.0 shipped a
# Linux arm64 native built for SVE2, which dies with SIGILL on arm64 CPUs without it.
jolt-jni = "6.1.1"
snaploader = "1.1.1-stable"
oshi-core = "7.4.0"
# Desktop-only Ktor WebSocket debug-control channel for sample-hello-cube (see
# docs/MVP_PLAN.md's debug-control-channel decision log entry). 3.5.2 at least: 3.5.1 brings
# kotlinx-io 0.9.0, whose wasm Node helper reads a bare `import.meta` that Kotlin 2.4.20's webpack
# leaves in samples:net-demo's classic-script bundle, so the page and its browser tests fail to load.
# kotlinx-io 0.9.1 (Ktor 3.5.2) no longer reads it.
ktor = "3.5.2"
# Raises the Netty that ktor-server-netty brings to samples:net-demo past CVE-2026-75595 (an SNI
# routing bypass in SslClientHelloHandler, fixed in 4.2.17.Final) until a Ktor patch release pulls it.
netty = "4.2.17.Final"
# jackson-core arrives on build-logic's classpath at 2.12.7 through the Android Gradle plugin; the
# constraint in build-logic/build.gradle.kts lifts it past CVE-2025-52999, CVE-2026-68494 and
# CVE-2026-89425 (parser denial of service).
jackson-core = "2.18.11"
# Tailwind spacing/sizing scale codegen (awake:engine:ui:tailwind-generator) -- generates the
# Tw.kt object from a vendored static scale, same manual-invoke shape as
# awake:backend:vulkan:generator.
kotlinpoet = "2.3.0"
junit = "4.13.2"
junit-version = "1.3.0"
espresso-core = "3.7.0"
androidx-test-runner = "1.7.0"
appcompat = "1.7.1"
material = "1.10.0"
# Pure-Kotlin Multiplatform arbitrary-precision arithmetic -- the only dependency
# :awake:editor:contract's RSA signature verifier (PluginArchiveVerifier) needs: modular
# exponentiation for the public-key operation. No JVM/Android-only java.security here, so the
# same verifier code runs on wasmJs and iOS too.
bignum = "0.3.10"

[libraries]
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson-core" }
vanniktech-maven-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech-publish" }
wgpu4k = { module = "io.ygdrasil:wgpu4k", version.ref = "wgpu4k" }
# wgpu4k-toolkit has the canvas/adapter/device bootstrap helpers (canvasContextRenderer,
# WGPUContext) the core wgpu4k module doesn't -- see wgpu4k-toolkit/src/webMain/kotlin/
# Surface.kt in the wgpu4k repo.
wgpu4k-toolkit = { module = "io.ygdrasil:wgpu4k-toolkit", version.ref = "wgpu4k" }
webgpu-ktypes-descriptors = { module = "io.ygdrasil:webgpu-ktypes-descriptors", version.ref = "webgpu-ktypes" }
napier = { module = "io.github.aakira:napier", version.ref = "napier" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
fleks = { module = "io.github.quillraven.fleks:Fleks", version.ref = "fleks" }
artemis-odb = { module = "net.onedaybeard.artemis:artemis-odb", version.ref = "artemis-odb" }
ashley = { module = "com.badlogicgames.ashley:ashley", version.ref = "ashley" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinx-benchmark" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinx-atomicfu" }
# Provides Dispatchers.Main on plain-JVM desktop -- without it, MainScope().launch (used by
# VulkanApplication.create()/WebGpuApplication.create() since the suspend-scene-loading
# refactor) throws "Module with the Main dispatcher is missing" at runtime. Not caught
# earlier because that refactor's own verification used iOS Simulator, not this module's
# actual desktop run tasks.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
# Wraps browser fetch()/DOM APIs for Kotlin/Wasm -- used by awake:base's wasmJs
# readResourceBytes actual (see docs/MVP_PLAN.md's web-demo decision log entry).
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
# JVM library (platform-independent Java classes) -- desktop build only, this machine is
# macOS ARM64. jolt-jni's desktop JVM library is released under 8 interchangeable artifact
# IDs (one per native platform); MacOSX_ARM64 is the one whose matching native classifier
# jar this dev machine also needs, so it's reused for both here.
jolt-jni-desktop = { module = "com.github.stephengold:jolt-jni-MacOSX_ARM64", version.ref = "jolt-jni" }
# The desktop natives, one artifact per platform; each is used with its `ReleaseSp` classifier,
# which a catalog entry cannot hold, so `variantOf` adds it where it is used.
jolt-jni-native-macos-arm64 = { module = "com.github.stephengold:jolt-jni-MacOSX_ARM64", version.ref = "jolt-jni" }
jolt-jni-native-macos-x64 = { module = "com.github.stephengold:jolt-jni-MacOSX64", version.ref = "jolt-jni" }
jolt-jni-native-linux-x64 = { module = "com.github.stephengold:jolt-jni-Linux64", version.ref = "jolt-jni" }
jolt-jni-native-linux-arm64 = { module = "com.github.stephengold:jolt-jni-Linux_ARM64", version.ref = "jolt-jni" }
jolt-jni-native-windows-x64 = { module = "com.github.stephengold:jolt-jni-Windows64", version.ref = "jolt-jni" }
# Android ships a single self-contained AAR per build type (Java classes + all native ABIs),
# unlike desktop's split JVM-library/native-library artifacts.
jolt-jni-android = { module = "com.github.stephengold:jolt-jni-Android", version.ref = "jolt-jni" }
# Extracts jolt-jni's native library (bundled inside the classified jar under
# osx/aarch64/... etc.) to a temp dir and loads it -- see jolt-jni's own "add to an existing
# project" doc for why this (rather than a bare System.loadLibrary) is the desktop-supported
# loading mechanism.
snaploader = { module = "io.github.electrostat-lab:snaploader", version.ref = "snaploader" }
# snaploader's own platform-detection dependency (see its "add to an existing project" doc).
oshi-core = { module = "com.github.oshi:oshi-core", version.ref = "oshi-core" }
# Desktop-only debug-control WebSocket server (sample-hello-cube's DebugControlServer) --
# CIO engine chosen over Netty for fewer transitive deps, since this is a single dev-tooling
# endpoint, not a production server.
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
# Netty rather than CIO for samples:net-demo's server: the CIO server engine throws
# "CIO Engine does not currently support HTTPS" on any sslConnector, so wss:// needs Netty.
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
# Client side of the same WebSocket transport, for samples:net-demo (docs/plans/network.md
# Phase 0). CIO again -- it is the one client engine that also compiles for native/wasm later,
# so the Phase 1 browser client does not force an engine swap.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
# Browser engine for the wasmJs client: delegates to the browser's own WebSocket API, which is
# the only way a page gets a socket at all.
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
# Generates the self-signed keystore the demo's wss:// server uses. Dev/test only -- a real
# deployment gets a CA-issued certificate, and a self-signed one proves nothing about identity.
ktor-network-tls-certificates = { module = "io.ktor:ktor-network-tls-certificates", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
# Tests only: answers awake:project:transport-ktor's requests in memory, with no server or engine.
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit-version" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
# Instrumented tests only: the Android device-test runner, so :awake:backend:jolt can run
# its commonTest suite against jolt-jni's real device natives.
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
bignum = { module = "com.ionspin.kotlin:bignum", version.ref = "bignum" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-library-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
binary-compat = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compat" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinx-benchmark" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
