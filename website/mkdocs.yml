site_name: AwakeKt Docs
site_description: Guides and reference for AwakeKt Engine, the Kotlin Multiplatform engine for 2D and 3D apps.
site_url: https://docs.awakekt.com/
repo_url: https://github.com/awakekt/awake
hooks:
  - hooks.py
plugins:
  - search
  - mike:
      alias_type: copy
      canonical_version: latest
      version_selector: true
extra:
  awake_version: 0.1.0-alpha.16
  awake_vulkan_version: 0.1.6
  # The Core release awake_vulkan_version was cut on; install snippets use this pair.
  awake_vulkan_core_version: 0.1.0-alpha.14
  version:
    provider: mike
theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/awake-glyph.svg
  favicon: assets/brand/awake-mark.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  # Light first; the toggle and prefers-color-scheme pick dark. Colours come from
  # stylesheets/awakekt.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
extra_css:
  - stylesheets/awakekt.css
nav:
  - Home: index.md
  - Get started:
      - Installation: get-started/installation.md
      - Your first window: get-started/first-window.md
      - Your first scene: get-started/first-scene.md
      - Load a scene document: get-started/load-a-scene-document.md
      - Run in the browser: get-started/run-in-the-browser.md
  - Guides:
      - Scene and ECS:
          - Scene documents: guides/scene-documents.md
          - Scene DSL: guides/scene-dsl.md
          - ECS: guides/ecs.md
          - App lifecycle: guides/app-lifecycle.md
          - Cameras and controls: guides/cameras-and-controls.md
          - Input: guides/input.md
          - Math: guides/math.md
      - Rendering:
          - Lights and shadows: guides/lights-and-shadows.md
          - Sky and fog: guides/sky-and-fog.md
          - Meshes and materials: guides/meshes-and-materials.md
          - glTF models: guides/gltf.md
          - Animation: guides/animation.md
          - Particles: guides/particles.md
          - Render plans and shaders: guides/shaders.md
          - Shader compilation: guides/shader-compilation.md
          - Vulkan backend: guides/vulkan.md
          - WebGPU backend: guides/webgpu.md
      - World and gameplay:
          - Physics: guides/physics.md
          - Jolt backend: guides/physics-jolt.md
          - Character controller: guides/character-controller.md
          - Navigation: guides/navigation.md
          - AI: guides/ai.md
          - Terrain: guides/terrain.md
          - Large worlds: guides/large-worlds.md
          - Audio: guides/audio.md
      - UI:
          - Game UI: guides/game-ui.md
          - UI with AwakeKt Compose: guides/ui.md
          - shadcn components: guides/shadcn.md
  - Reference:
      - Scene document schema: reference/scene-document-schema.md
      - Scene document components: reference/scene-document-components.md
      - Component map: reference/component-map.md
      - Modules: reference/modules.md
      - Render hardware interface: reference/rhi.md
      - Releases and compatibility: reference/releases.md
      - Glossary: reference/glossary.md
      - Components:
          - Button: reference/components/button.md
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - .
        - ..
        - website/docs
      check_paths: true
      # Included regions start at the column they have in their test; strip it so every sample
      # starts flush left.
      dedent_subsections: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
