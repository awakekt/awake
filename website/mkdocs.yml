site_name: Awake Engine
site_url: https://docs.awakekt.com/
repo_url: https://github.com/awakekt/awake
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Awake Studio: studio.md
  - Editor Suite:
      - Overview: editor/index.md
      - Scene Editor: editor/scene.md
      - Physics Editor: editor/physics.md
      - AI Editor: editor/ai.md
      - Render Editor: editor/render.md
  - Core & ECS:
      - Core: engine/core.md
      - Core Math: core/math.md
      - ECS Runtime: engine/ecs.md
      - Scene Runtime: engine/scene.md
      - Scene Navigation: scene/navigation.md
      - Scene Authoring: scene/authoring.md
      - Scene Rendering: scene/rendering.md
      - Scene AI: scene/ai.md
      - Scene World: scene/world.md
      - App & Bootstrap: engine/bootstrap.md
  - Rendering & Backends:
      - Hardware Interface (RHI): rendering/rhi.md
      - Vulkan Backend: rendering/vulkan.md
      - WebGPU Backend: rendering/webgpu.md
      - Terrain Authoring: asset/terrain.md
      - Shader DSL: asset/shader-dsl.md
      - Shaders & Pipelines: rendering/shaders.md
      - Naga Shader Compiler: rendering/shader-compiler.md
  - Physics:
      - Physics API: physics/api.md
      - Jolt Bridge: physics/jolt.md
  - UI & Compose:
      - Compose Runtime: ui/compose.md
      - Design System: ui/index.md
      - Shadcn Components: ui/shadcn.md
      - Material 3: ui/material3.md
  - Roadmap & Releases:
      - Release Process & Milestones: roadmap.md
  - Guides:
      - Theming: guides/theming.md
      - UI Components:
          - Buttons: guides/components/button.md
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - .
        - ..
        - website/docs
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
