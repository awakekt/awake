site_name: Awake Engine
site_url: https://docs.awakekt.com/
repo_url: https://github.com/awakekt/awake
hooks:
  - hooks.py
plugins:
  - search
  - mike:
      alias_type: copy
      canonical_version: latest
      version_selector: true
extra:
  awake_version: 0.1.0-alpha.4
  version:
    provider: mike
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
nav:
  - Home: index.md
  - Get Started:
      - Installation: getting-started.md
  - Core:
      - Core Runtime: engine/core.md
      - Math: core/math.md
      - Entity Component System: engine/ecs.md
      - Application Lifecycle: engine/bootstrap.md
  - Scene:
      - Scene Runtime: engine/scene.md
      - Scene Authoring: scene/authoring.md
      - Scene Rendering: scene/rendering.md
      - Navigation: scene/navigation.md
      - AI: scene/ai.md
      - World Streaming: scene/world.md
  - Rendering & Backends:
      - Render Hardware Interface: rendering/rhi.md
      - Vulkan: rendering/vulkan.md
      - WebGPU: rendering/webgpu.md
      - Shaders & Pipelines: rendering/shaders.md
      - Shader DSL: asset/shader-dsl.md
      - Shader Compiler: rendering/shader-compiler.md
  - Physics:
      - Physics API: physics/api.md
      - Jolt Backend: physics/jolt.md
  - UI:
      - UI Runtime: ui/index.md
      - Compose Runtime: ui/compose.md
      - Shadcn: ui/shadcn.md
      - Theming: guides/theming.md
      - Button: guides/components/button.md
  - Assets:
      - Terrain: asset/terrain.md
  - Releases & Compatibility: releases.md
markdown_extensions:
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - .
        - ..
        - website/docs
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
