site_name: Awake Engine
site_url: https://docs.awakekt.com/
repo_url: https://github.com/awakekt/awake
hooks:
  - hooks.py
plugins:
  - search
  - mike:
      alias_type: copy
      canonical_version: latest
      version_selector: true
extra:
  awake_version: 0.1.0-alpha.4
  version:
    provider: mike
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
nav:
  - Home: index.md
  - Start Here:
      - Install & First App: getting-started.md
      - Releases & Compatibility: releases.md
  - Core:
      - Overview: engine/core.md
      - Tutorials & Samples: core/tutorial.md
      - Math:
          - Guide & Verified Samples: core/math.md
      - ECS:
          - Overview: engine/ecs.md
          - Tutorial & Samples: engine/ecs-tutorial.md
      - Application Bootstrap: engine/bootstrap.md
  - Scene:
      - Overview: engine/scene.md
      - Tutorials & Samples: scene/tutorial.md
      - Authoring: scene/authoring.md
      - Rendering: scene/rendering.md
      - Navigation: scene/navigation.md
      - AI: scene/ai.md
      - World: scene/world.md
  - Backends:
      - Overview: rendering/rhi.md
      - Tutorials & Samples: rendering/tutorial.md
      - Vulkan: rendering/vulkan.md
      - WebGPU: rendering/webgpu.md
      - Shader DSL: asset/shader-dsl.md
      - Shaders & Pipelines: rendering/shaders.md
      - Naga Shader Compiler: rendering/shader-compiler.md
  - Physics:
      - Overview: physics/api.md
      - Tutorials & Samples: physics/tutorial.md
      - Jolt: physics/jolt.md
  - UI:
      - Overview: ui/index.md
      - Tutorials & Samples: ui/tutorial.md
      - Compose Runtime: ui/compose.md
      - Theming: guides/theming.md
      - Components:
          - Button: guides/components/button.md
          - Shadcn: ui/shadcn.md
          - Material 3: ui/material3.md
  - Assets:
      - Terrain: asset/terrain.md
markdown_extensions:
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path:
        - .
        - ..
        - website/docs
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
