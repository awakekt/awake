#Gradle
org.gradle.jvmargs=-Xmx4096M -XX:+UseParallelGC -XX:SoftRefLRUPolicyMSPerMB=50 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
# Native file system watching avoids scanning disk on every build
org.gradle.vfs.watch=true
# Independent module subgraphs build concurrently instead of serially -- real win on a 30+
# module tree. workers.max capped well below the machine's core count: each parallel module
# build can spawn its own Kotlin compiler daemon (up to the 4096M heap above), so uncapped
# parallelism risks memory pressure/thrashing rather than a speedup on a machine with 18GB RAM.
org.gradle.parallel=true
org.gradle.workers.max=4
# Pin the Gradle daemon/build JVM in local.properties or JAVA_HOME if system java tracks JDK 26+
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
# Pack KMP metadata and KLIB targets (iOS, WasmJs) into a single .kar.xz archive per module to cut
# Maven Central file count and release size by >50% (requires Kotlin 2.5+ in consumers).
kotlin.publicationFormat=KOTLIN_ARCHIVE
#Dokka 2.x plugin mode
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
#Android
android.useAndroidX=true
android.compileSdk=35
android.targetSdk=35
android.minSdk=33

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# A dependency or plugin request that times out or gets a 408, 429 or 5xx is retried, doubling the
# wait each time: 2, 4, 8, 16 and 32 s, about a minute in all. Gradle's default, three attempts
# waiting 1 s then 2 s, gave up inside Maven Central's rate limiting: five runs went red on a 429 on
# 16-17 Nov before they built anything (#1592). Kept in step with build-logic/gradle.properties,
# which RepositoryRetryTest checks.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
