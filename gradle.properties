#Gradle
org.gradle.jvmargs=-Xmx4096M -XX:+UseParallelGC -XX:SoftRefLRUPolicyMSPerMB=50 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
# Native file system watching avoids scanning disk on every build
org.gradle.vfs.watch=true
# Independent module subgraphs build concurrently instead of serially -- real win on a 30+
# module tree. workers.max capped well below the machine's core count: each parallel module
# build can spawn its own Kotlin compiler daemon (up to the 4096M heap above), so uncapped
# parallelism risks memory pressure/thrashing rather than a speedup on a machine with 18GB RAM.
org.gradle.parallel=true
org.gradle.workers.max=4
# Pin the Gradle daemon/build JVM in local.properties or JAVA_HOME if system java tracks JDK 26+
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Dokka 2.x plugin mode
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
#Android
android.useAndroidX=true
android.compileSdk=35
android.targetSdk=35
android.minSdk=33

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
