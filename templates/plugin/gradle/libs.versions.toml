[versions]
kotlin = "2.4.20"
# Awake Core release the plugin compiles against. Its editor contract is the only API a plugin uses.
awake = "0.8.6"

[libraries]
awake-editor-contract = { module = "com.awakekt.awake.editor:contract", version.ref = "awake" }
awake-ui-shadcn = { module = "com.awakekt.awake.ui:shadcn", version.ref = "awake" }
awake-scene-core = { module = "com.awakekt.awake.scene:scene-core", version.ref = "awake" }
awake-scene-binding = { module = "com.awakekt.awake.scene:binding", version.ref = "awake" }
# Signs the .awakeplugin archive; used by the build, not bundled with the plugin.
awake-plugin-archive = { module = "com.awakekt.awake:plugin-archive", version.ref = "awake" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
awake-scene-components = { id = "com.awakekt.awake.plugin.scene-components", version.ref = "awake" }
